<template>
    <lightning-card title="Sample Component" icon-name="custom:custom63">
        <div class="slds-p-around_medium">
            <p class="slds-text-heading_medium slds-m-bottom_medium">{message}</p>
            
            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button 
                        variant="brand" 
                        label="Click Me" 
                        onclick={handleClick}>
                    </lightning-button>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button 
                        variant="neutral" 
                        label="Reset" 
                        onclick={handleReset}>
                    </lightning-button>
                </div>
            </div>
            
            <div class="slds-m-top_medium">
                <p class="slds-text-body_regular">Counter: {counter}</p>
            </div>
        </div>
    </lightning-card>
</template>
