name: Salesforce CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  # ==============================================================================
  # QUALITY GATE CONFIGURATION
  # ==============================================================================
  # Organizational standards for code quality and deployment validation
  SEVERITY_THRESHOLD: 3  # High/Critical violations only (1=all, 2=medium+, 3=high+, 4=critical)
  COVERAGE_THRESHOLD: 75 # Minimum code coverage percentage required

jobs:
  # ==============================================================================
  # COMPREHENSIVE DEPLOYMENT VALIDATION PIPELINE
  # ==============================================================================
  # Validates all changes against organizational standards including:
  # - Static code analysis for security and quality violations
  # - Intelligent test selection and execution
  # - Code coverage verification against delta package
  # - Component deployment validation
  # - Comprehensive quality gate enforcement
  # ==============================================================================

  deployment-validation:
    name: Salesforce Deployment Quality Gates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      # ---------------------------------------------------------------------------
      # STAGE 1: ENVIRONMENT CONFIGURATION
      # ---------------------------------------------------------------------------
      # Prepare runtime environment with required tools and dependencies
      # ---------------------------------------------------------------------------

      - name: Initialize Repository Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Java Runtime Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Configure Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Optimize Salesforce CLI Performance
        uses: actions/cache@v4
        with:
          path: ~/.sf
          key: sf-cli-${{ runner.os }}-${{ hashFiles('**/sfdx-project.json') }}
          restore-keys: |
            sf-cli-${{ runner.os }}-

      - name: Install Salesforce CLI Tools
        run: |
          npm install -g @salesforce/cli --silent
          sf --version

      # ---------------------------------------------------------------------------
      # STAGE 2: SALESFORCE ENVIRONMENT AUTHENTICATION
      # ---------------------------------------------------------------------------
      # Establish secure connection to target Salesforce environment
      # ---------------------------------------------------------------------------

      - name: Establish Salesforce Environment Connection
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: ./scripts/authenticate.sh

      # ---------------------------------------------------------------------------
      # STAGE 3: DEPLOYMENT DELTA GENERATION
      # ---------------------------------------------------------------------------
      # Identify and package changes for incremental deployment validation
      # ---------------------------------------------------------------------------

      - name: Install Delta Generation Dependencies
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Deployment Delta Package
        run: ./scripts/generate_delta.sh

      # ---------------------------------------------------------------------------
      # STAGE 4: STATIC CODE ANALYSIS
      # ---------------------------------------------------------------------------
      # Execute comprehensive code quality and security analysis
      # ---------------------------------------------------------------------------

      - name: Execute Static Code Analysis
        run: ./scripts/analyze_code.sh

      - name: Archive Code Analysis Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-code-analysis-reports
          path: reports/
          retention-days: 30

      # ---------------------------------------------------------------------------
      # STAGE 5: INTELLIGENT TEST EXECUTION
      # ---------------------------------------------------------------------------
      # Analyze changes and execute targeted tests with fallback strategies
      # ---------------------------------------------------------------------------

      - name: Analyze Changes and Map Test Classes
        run: ./scripts/map_tests.sh

      - name: Execute Deployment Validation
        run: ./scripts/validate_deployment.sh

      - name: Filter Coverage for Delta Classes
        if: always()
        run: ./scripts/filter_coverage.sh

      # ---------------------------------------------------------------------------
      # STAGE 6: VALIDATION REPORTING AND QUALITY GATES
      # ---------------------------------------------------------------------------
      # Generate comprehensive reports and validate against quality standards
      # ---------------------------------------------------------------------------

      - name: Generate Validation Reports and Summaries
        run: ./scripts/generate_reports.sh

      - name: Archive Validation Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-validation-reports
          path: reports/
          retention-days: 30

      # ---------------------------------------------------------------------------
      # QUALITY GATE VALIDATION
      # ---------------------------------------------------------------------------
      # Final validation step determines pipeline success/failure based on
      # comprehensive quality metrics and organizational standards
      # ---------------------------------------------------------------------------

      - name: Validate Quality Gates
        if: always()
        run: ./scripts/generate_reports.sh
