          curl -o rulesets/apex/design.xml https://raw.githubusercontent.com/pmd/pmd/master/pmd-apex/src/main/resources/category/apex/design.xml
          
          # Install PMD
          echo "📦 Installing PMD..."
          npm install -g pmd-bin
          
          # Run PMD analysis on Apex classes
          echo "🔍 Running PMD Security Analysis..."
          if [ -d "force-app/main/default/classes" ]; then
            pmd -d force-app/main/default/classes \
                -R rulesets/apex/security.xml \
                -f text \
