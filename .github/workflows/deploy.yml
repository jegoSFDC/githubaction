# File: .github/workflows/salesforce-ci.yml
name: Salesforce CI/CD (condensed)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  SEVERITY_THRESHOLD: 3
  COVERAGE_THRESHOLD: 75

jobs:
  pr-validation:
    name: PR Validation (condensed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (Temurin 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore caches (sf & npm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.sf
            ~/.npm
            ~/.npm-global
          key: sf-node-${{ runner.os }}-${{ hashFiles('**/package-lock.json','**/sfdx-project.json') }}
          restore-keys: |
            sf-node-${{ runner.os }}-

      - name: Run condensed CI script (delta, test-mapping, validation, reports)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEVERITY_THRESHOLD: ${{ env.SEVERITY_THRESHOLD }}
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD }}
        run: |
          chmod +x .github/scripts/ci.sh
          .github/scripts/ci.sh

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/
          retention-days: 30

# ---------------------------
# File: .github/scripts/ci.sh
# (Move the big inlined logic into this script so the workflow stays short and readable.)
# Make sure this file is executable in your repo (chmod +x .github/scripts/ci.sh)
# ---------------------------

#!/usr/bin/env bash
set -euo pipefail
IFS=$'\n\t'

# Helpful logging
function log() { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"; }

log "Starting condensed CI script"

# Ensure reports dir exists
mkdir -p reports delta

# Install sf CLI if missing (fast path: use npm global)
if ! command -v sf >/dev/null 2>&1; then
  log "Installing Salesforce CLI (npm global)"
  npm install -g @salesforce/cli --silent
  sf --version || true
fi

# Install sfdx-git-delta plugin if missing
if ! sf plugins --core | grep -q sgd; then
  log "Installing sfdx-git-delta plugin"
  echo y | sf plugins install sfdx-git-delta || true
fi

# Authenticate (non-interactive) — write to a temp file and remove it ASAP
if [ -n "${SF_AUTH_URL:-}" ]; then
  log "Authenticating to Salesforce org for validation"
  tmpfile=$(mktemp)
  echo "$SF_AUTH_URL" > "$tmpfile"
  sf org login sfdx-url --sfdx-url-file "$tmpfile" --alias sandbox --set-default || true
  rm -f "$tmpfile"
else
  log "SF_AUTH_URL not provided; skipping org login (useful for local dry runs)."
fi

# Generate delta between base ref and HEAD
# Use the GitHub-provided base ref where possible to avoid fetching full history repeatedly
BASE_REF="${{ github.base_ref }}"
if [ -z "$BASE_REF" ]; then
  # fallback to default branch
  BASE_REF="origin/main"
fi

log "Fetching base ref ($BASE_REF) and generating delta"
# Ensure safe directory for git operations
git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
# Fetch only the base ref (faster than full history)
git fetch origin "$BASE_REF" --quiet || git fetch --all --quiet || true

sf sgd source delta --to HEAD --from "origin/${{ github.base_ref }}" --output delta --generate-delta || true
ls -la delta || true

# Record delta package contents (if any)
if [ -f delta/package/package.xml ]; then
  log "Found delta/package/package.xml"
  DELTA_APEX_CLASSES=$(grep -oP '(?<=<members>).*?(?=</members>)' delta/package/package.xml | grep -v '^$' | tr '\n' ' ' | sed 's/ *$//' || true)
else
  log "No delta/package/package.xml found"
  DELTA_APEX_CLASSES=""
fi

# Find apex classes added in delta (file-based)
APEX_CLASSES=$(find delta/force-app -path '*/classes/*.cls' -maxdepth 5 -type f -exec basename {} .cls \; | tr '\n' ' ' | sed 's/ *$//' || true)
log "Apex classes in delta (file scan): ${APEX_CLASSES:-none}"

# Classify classes into tests and prod; build mapping
TESTS_IN_DELTA=""
PROD_CLASSES=""
if [ -n "$APEX_CLASSES" ]; then
  for cls in $APEX_CLASSES; do
    file_path=$(find delta/force-app force-app -path "*/classes/${cls}.cls" 2>/dev/null | head -n1 || true)
    if [ -z "$file_path" ]; then
      PROD_CLASSES="$PROD_CLASSES $cls"
      continue
    fi
    if grep -qi "@isTest" "$file_path"; then
      TESTS_IN_DELTA="$TESTS_IN_DELTA $cls"
    else
      PROD_CLASSES="$PROD_CLASSES $cls"
    fi
  done
  TESTS_IN_DELTA=$(echo "$TESTS_IN_DELTA" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
  PROD_CLASSES=$(echo "$PROD_CLASSES" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
fi

log "Production classes: ${PROD_CLASSES:-none}"
log "Test classes: ${TESTS_IN_DELTA:-none}"

# Simple heuristic: look for tests that reference production classes
RELATED_TESTS=""
if [ -n "$PROD_CLASSES" ] && [ -n "$TESTS_IN_DELTA" ]; then
  for pc in $PROD_CLASSES; do
    found=""
    for tc in $TESTS_IN_DELTA; do
      tf=$(find delta/force-app force-app -path "*/classes/${tc}.cls" 2>/dev/null | head -n1 || true)
      if [ -n "$tf" ] && grep -qiE "(new[[:space:]]+${pc}\b|${pc}\\.[A-Za-z_]|${pc}[[:space:]]*\()" "$tf"; then
        found="$found $tc"
      fi
    done
    found=$(echo "$found" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
    if [ -n "$found" ]; then
      RELATED_TESTS="$RELATED_TESTS $found"
    fi
  done
fi
RELATED_TESTS=$(echo "$RELATED_TESTS" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
log "Mapped tests: ${RELATED_TESTS:-none}"

# Save env values to reports so the upstream workflow steps and upload can pick them up
cat > reports/test-mapping.json <<EOF
{ "mapping": { "prod": "${PROD_CLASSES}", "tests": "${TESTS_IN_DELTA}", "mappedTests": "${RELATED_TESTS}" } }
EOF

# Run deploy validation using mapped tests first, fallback to RunLocalTests if needed
# Use --dry-run to avoid accidental deploys (same as original)
REPORT_FILE=reports/deploy-report.json
DEFAULT_REPORT='{"result":{"status":"Failed","message":"No deploy run performed"}}'
echo "$DEFAULT_REPORT" > "$REPORT_FILE"

if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
  log "Deployable metadata detected in delta"
  if echo "$APEX_CLASSES" | grep -q . ; then
    log "Apex changes detected — will run tests"
    if [ -n "$RELATED_TESTS" ]; then
      TESTS_CSV=$(echo "$RELATED_TESTS" | xargs -n1 | paste -sd, - || true)
      log "Attempting mapped-tests validation with: ${TESTS_CSV}"
      if sf project deploy start --source-dir delta/force-app --target-org sandbox --dry-run --test-level RunSpecifiedTests --tests "$TESTS_CSV" --json > "$REPORT_FILE" 2>&1; then
        log "Mapped-tests validation succeeded"
      else
        log "Mapped-tests validation failed; will fallback to RunLocalTests"
        if sf project deploy start --source-dir delta/force-app --target-org sandbox --dry-run --test-level RunLocalTests --json > "${REPORT_FILE}.coverage.json" 2>&1; then
          mv "${REPORT_FILE}.coverage.json" "$REPORT_FILE"
          log "Fallback RunLocalTests succeeded"
        else
          mv "${REPORT_FILE}.coverage.json" "$REPORT_FILE" || true
          log "Fallback RunLocalTests failed"
        fi
      fi
    else
      log "No mapped tests found; running RunLocalTests"
      if sf project deploy start --source-dir delta/force-app --target-org sandbox --dry-run --test-level RunLocalTests --json > "$REPORT_FILE" 2>&1; then
        log "RunLocalTests validation succeeded"
      else
        log "RunLocalTests validation failed"
      fi
    fi
  else
    log "No Apex changes — running NoTestRun validation"
    sf project deploy start --source-dir delta/force-app --target-org sandbox --dry-run --test-level NoTestRun --json > "$REPORT_FILE" 2>&1 || true
  fi
else
  log "No deployable metadata in delta; skipping validation"
  echo '{"result":{"status":"Skipped","message":"No changes to deploy"}}' > "$REPORT_FILE"
fi

# Filter coverage to only delta classes (if coverage exists)
if jq -e '.result.details.runTestResult.codeCoverage' "$REPORT_FILE" >/dev/null 2>&1 && [ -n "${DELTA_APEX_CLASSES:-}" ]; then
  log "Filtering coverage data for delta classes"
  jq --arg delta_classes "$DELTA_APEX_CLASSES" '
    if .result.details.runTestResult.codeCoverage then
      .result.details.runTestResult.codeCoverage = [
        .result.details.runTestResult.codeCoverage[]? |
        select(.name as $name | ($delta_classes | split(" ") | index($name)))
      ]
    else
      .
    end
  ' "$REPORT_FILE" > "${REPORT_FILE}.filtered" || true
  if [ -f "${REPORT_FILE}.filtered" ]; then
    mv "${REPORT_FILE}.filtered" "$REPORT_FILE"
    log "Coverage filtered"
  fi
fi

# Create a small human-friendly summary file
STATUS=$(jq -r '.result.status // "Failed"' "$REPORT_FILE" 2>/dev/null || echo "Failed")
COMP_FAIL_COUNT=$(jq -r '(.result.details.componentFailures | length) // 0' "$REPORT_FILE" 2>/dev/null || echo 0)
TEST_FAIL_COUNT=$(jq -r '(.result.details.runTestResult.failures | length) // 0' "$REPORT_FILE" 2>/dev/null || echo 0)
COVERAGE=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' "$REPORT_FILE" 2>/dev/null || echo 0)
COVERAGE=${COVERAGE%.*}

cat > reports/validation-summary.txt <<EOF
Status: ${STATUS}
Component failures: ${COMP_FAIL_COUNT}
Test failures: ${TEST_FAIL_COUNT}
Average coverage: ${COVERAGE}%
EOF

log "Condensed CI script finished — reports written to reports/"
exit 0
