            if [ -f "pmd-lwc-report.txt" ]; then
              cat pmd-lwc-report.txt
            else
              echo "✅ No LWC violations found!"
            fi
          else
            echo "ℹ️ No LWC components found for analysis"
          fi
          
          # Generate summary
