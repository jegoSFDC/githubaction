name: Salesforce CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  SEVERITY_THRESHOLD: 3  # High/Critical only (1=all, 2=medium+, 3=high+, 4=critical)

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node & Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.sf
          key: sf-cli-${{ runner.os }}-${{ hashFiles('**/sfdx-project.json') }}
          restore-keys: |
            sf-cli-${{ runner.os }}-

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli --silent
          sf --version

      - name: Authenticate Salesforce (PR Validation)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > authFile.txt
          sf org login sfdx-url --sfdx-url-file authFile.txt --alias sandbox --set-default

      - name: Create Delta Output Directory
        run: mkdir -p delta reports

      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Delta using sfdx-git-delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main --quiet
          sf sgd source delta --to HEAD --from origin/main --output delta --generate-delta

      - name: Show Generated Package.xml Files
        run: |
          echo "=== Delta Directory Structure ==="
          find delta -type f | head -20 || echo "No delta files found"
          echo ""
          echo "=== Package.xml (if exists) ==="
          [ -f delta/package/package.xml ] && cat delta/package/package.xml || echo "No package.xml"
          echo ""
          echo "=== Destructive Changes (if exists) ==="
          find delta -name "destructiveChanges*.xml" -exec echo "Found: {}" \; -exec cat {} \; || echo "No destructive changes"

      - name: Run Salesforce Code Analyzer for Apex
        id: run-code-analyzer-apex
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >
            --target force-app/main/default/classes
            --view detail
            --output-file reports/apex.json
            --severity-threshold ${{ env.SEVERITY_THRESHOLD }}
          results-artifact-name: code-analyzer-apex-results
        continue-on-error: true

      - name: Run Salesforce Code Analyzer for LWC
        id: run-code-analyzer-lwc
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >
            --target force-app/main/default/lwc
            --view detail
            --output-file reports/lwc.json
            --severity-threshold ${{ env.SEVERITY_THRESHOLD }}
          results-artifact-name: code-analyzer-lwc-results
        continue-on-error: true

      - name: Upload Code Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analysis-reports
          path: reports/
          retention-days: 30

      - name: Display Code Analysis Results
        if: always()
        run: |
          echo "🔍 Static Code Analysis Results:"
          echo "=================================="
          
          # Display Apex results with correct parsing
          if [ -f "reports/apex.json" ] && [ -s "reports/apex.json" ]; then
            echo "📊 Apex Analysis Results:"
            
            # Use correct JSON path for violations count
            APEX_VIOLATIONS=$(cat reports/apex.json | jq '.violations | length' 2>/dev/null || echo "0")
            
            if [ "$APEX_VIOLATIONS" -gt 0 ]; then
              echo "⚠️  Apex Violations: $APEX_VIOLATIONS found"
              echo "High Priority Issues:"
              cat reports/apex.json | jq -r '.violations[]? | select(.severity <= 3) | "  • \(.fileName // .file) - \(.ruleName): \(.message)"' 2>/dev/null | head -10 || \
              echo "Check reports/apex.json for details"
            else
              echo "✅ No Apex violations found!"
            fi
          else
            echo "✅ No Apex violations found!"
          fi
          
          echo ""
          
          # Display LWC results with correct parsing
          if [ -f "reports/lwc.json" ] && [ -s "reports/lwc.json" ]; then
            echo "📊 LWC Analysis Results:"
            
            # Use correct JSON path for violations count
            LWC_VIOLATIONS=$(cat reports/lwc.json | jq '.violations | length' 2>/dev/null || echo "0")
            
            if [ "$LWC_VIOLATIONS" -gt 0 ]; then
              echo "⚠️  LWC Violations: $LWC_VIOLATIONS found"
              echo "Key Issues:"
              cat reports/lwc.json | jq -r '.violations[]? | select(.severity <= 3) | "  • \(.fileName // .file) - \(.ruleName): \(.message)"' 2>/dev/null | head -5 || \
              echo "Check reports/lwc.json for details"
            else
              echo "✅ No LWC violations found!"
            fi
          else
            echo "✅ No LWC violations found!"
          fi

      - name: Validate with Test Selection
        id: validate_deploy
        run: |
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            echo "Analyzing delta for specified test execution..."
            
            # Check if there are any actual Apex files (.cls or .trigger)
            if find delta/force-app -name "*.cls" -o -name "*.trigger" | grep -q .; then
              echo "🔍 Found Apex files, analyzing deployment package..."
              
              # Get Apex classes being deployed (only actual Apex classes)
              APEX_CLASSES=$(grep -A 10 '<name>ApexClass</name>' delta/package/package.xml 2>/dev/null | \
                grep -o '<members>[^<]*</members>' | \
                sed 's/<members>//g; s/<\/members>//g' | \
                grep -v -E 'Test$|test$' | tr '\n' ' ' | sed 's/ $//')
              
              # Get test classes being deployed
              DEPLOYED_TESTS=$(grep -A 10 '<name>ApexClass</name>' delta/package/package.xml 2>/dev/null | \
                grep -o '<members>[^<]*</members>' | \
                sed 's/<members>//g; s/<\/members>//g' | \
                grep -E 'Test$|test$' | tr '\n' ' ' | sed 's/ $//')
              
              echo "Apex classes found: $APEX_CLASSES"
              echo "Test classes found: $DEPLOYED_TESTS"
              
              if [ -n "$APEX_CLASSES" ]; then
                echo "🔧 Apex classes being deployed: $APEX_CLASSES"
                
                # Find corresponding test classes for deployed Apex classes
                RELATED_TESTS=""
                for class in $APEX_CLASSES; do
                  TEST_CLASS="${class}Test"
                  if echo "$DEPLOYED_TESTS" | grep -q "$TEST_CLASS"; then
                    RELATED_TESTS="$RELATED_TESTS $TEST_CLASS"
                  fi
                done
                
                if [ -n "$RELATED_TESTS" ]; then
                  echo "🎯 Running related test classes: $(echo $RELATED_TESTS | sed 's/ $//')"
                  sf project deploy start \
                    --source-dir delta/force-app \
                    --target-org sandbox \
                    --dry-run \
                    --test-level RunSpecifiedTests \
                    --tests $(echo $RELATED_TESTS | sed 's/ $//')
                else
                  echo "⚠️  No related test classes found, running all local tests"
                  sf project deploy start \
                    --source-dir delta/force-app \
                    --target-org sandbox \
                    --dry-run \
                    --test-level RunLocalTests
                fi
              elif [ -n "$DEPLOYED_TESTS" ]; then
                echo "🧪 Only test classes being deployed: $DEPLOYED_TESTS"
                sf project deploy start \
                  --source-dir delta/force-app \
                  --target-org sandbox \
                  --dry-run \
                  --test-level RunSpecifiedTests \
                  --tests $DEPLOYED_TESTS
              else
                echo "📦 No Apex classes or test classes found, skipping test execution"
                sf project deploy start \
                  --source-dir delta/force-app \
                  --target-org sandbox \
                  --dry-run \
                  --test-level NoTestRun
              fi
            else
              echo "📦 No Apex files found, skipping test execution"
              sf project deploy start \
                --source-dir delta/force-app \
                --target-org sandbox \
                --dry-run \
                --test-level NoTestRun
            fi
          else
            echo "📭 No deployable metadata found in delta. Skipping validation."
          fi

      - name: Deployment Summary Report
        if: always()
        run: |
          echo ""
          echo "🚦 Validation Status: ${{ steps.validate_deploy.outcome == 'success' && '✅ Succeeded' || '❌ Failed' }}"
          echo ""
          
          # Check deployment status
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            
            # Extract and display components in the requested format
            echo "📦 Deployment Package Metadata:"
            echo "==============================================="
            
            COMPONENT_COUNT=0
            COMPONENTS_LIST=""
            
            if [ -f "delta/package/package.xml" ]; then
              # Extract all metadata components and number them
              while IFS= read -r line; do
                if [[ $line =~ members\>([^<]+)\</members ]]; then
                  COMPONENT="${BASH_REMATCH[1]}"
                  COMPONENT_COUNT=$((COMPONENT_COUNT + 1))
                  COMPONENTS_LIST="$COMPONENTS_LIST$COMPONENT_COUNT. $COMPONENT"$'\n'
                fi
              done < <(grep '<members>' delta/package/package.xml)
              
              if [ $COMPONENT_COUNT -gt 0 ]; then
                echo "✅ **Number of Component Successes:** $COMPONENT_COUNT"
                echo ""
                echo "🟢 **Components Validated Successfully:**"
                echo "$COMPONENTS_LIST"
              else
                echo "❌ No components found in package.xml"
              fi
            else
              echo "❌ No package.xml found"
            fi
            echo ""
            
            # Static Code Analysis Summary - FIXED PARSING
            echo "🔍 Static Code Analysis"
            APEX_VIOLATIONS=0
            LWC_VIOLATIONS=0
            
            if [ -f "reports/apex.json" ] && [ -s "reports/apex.json" ]; then
              APEX_VIOLATIONS=$(cat reports/apex.json | jq '.violations | length' 2>/dev/null || echo "0")
              if [ "$APEX_VIOLATIONS" -gt 0 ]; then
                echo "⚠️  Apex Violations: $APEX_VIOLATIONS found"
              else
                echo "✅ No Apex Violations"
              fi
            else
              echo "✅ No Apex Violations"
            fi
            
            if [ -f "reports/lwc.json" ] && [ -s "reports/lwc.json" ]; then
              LWC_VIOLATIONS=$(cat reports/lwc.json | jq '.violations | length' 2>/dev/null || echo "0")
              if [ "$LWC_VIOLATIONS" -gt 0 ]; then
                echo "⚠️  LWC Violations: $LWC_VIOLATIONS found"
              else
                echo "✅ No LWC Violations"
              fi
            else
              echo "✅ No LWC Violations"
            fi
            echo ""
            
            # Quality Score
            echo "📊 Quality Score"
            TOTAL_VIOLATIONS=$((APEX_VIOLATIONS + LWC_VIOLATIONS))
            if [ $TOTAL_VIOLATIONS -eq 0 ]; then
              echo "Code Quality: 🟢 Excellent (0 violations)"
            elif [ $TOTAL_VIOLATIONS -le 5 ]; then
              echo "Code Quality: 🟡 Good ($TOTAL_VIOLATIONS violations)"
            else
              echo "Code Quality: 🔴 Needs Attention ($TOTAL_VIOLATIONS violations)"
            fi
            
            if [ "${{ steps.validate_deploy.outcome }}" = "failure" ]; then
              echo "Deployment: ❌ Failed (tests & coverage issues)"
            else
              echo "Deployment: ✅ Succeeded"
            fi
            echo ""
            
            # Test Results
            echo "🎯 Test Results"
            if [ "${{ steps.validate_deploy.outcome }}" = "failure" ]; then
              echo "Test Execution → ❌ Failed (check logs above)"
              echo "Coverage → ❌ Below 75% requirement"
            else
              echo "Test Execution → ✅ Passed"
              echo "Coverage → ✅ All requirements met"
            fi
            
          else
            echo "📌 Validation Status: Skipped"
            echo "ℹ️  Reason: No deployable metadata found in delta"
            echo ""
            echo "🔍 Static Code Analysis"
            echo "✅ No Apex Violations"
            echo "✅ No LWC Violations"
            echo ""
            echo "📊 Quality Score"
            echo "Code Quality: 🟢 Excellent (0 violations)"
            echo "Deployment: ⚪ Skipped (no changes)"
          fi
