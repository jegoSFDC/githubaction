name: Salesforce CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch (main) for comparison
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --no-tags --prune

      - name: Authenticate Salesforce (PR Validation)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > authFile.txt
          sf org login sfdx-url --sfdx-url-file authFile.txt --alias sandbox --set-default

      - name: Create Delta Output Directory
        run: mkdir -p delta

      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Delta using sfdx-git-delta (base->head)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          FROM_REF=origin/${{ github.event.pull_request.base.ref }}
          TO_REF=${{ github.event.pull_request.head.sha }}
          echo "Comparing $FROM_REF -> $TO_REF"
          sf sgd source delta \
            --from "$FROM_REF" \
            --to "$TO_REF" \
            -o delta \
            --generate-delta \
            -a 58.0 \
            -s force-app/

      - name: Debug: show delta tree and files
        run: |
          echo "=== delta directory listing ==="
          ls -R delta || true
          echo "=== show package.xml if present ==="
          [ -f delta/package/package.xml ] && sed -n '1,200p' delta/package/package.xml || echo "no package.xml"
          echo "=== find any destructiveChanges.xml files ==="
          find delta -type f -name "destructiveChanges*.xml" -print -exec sed -n '1,200p' {} \; || true

      - name: Validate Delta Deployment (handles regular + destructive)
        run: |
          DC_FILE=$(find delta -type f -name 'destructiveChanges*.xml' -print -quit || true)
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✅ Regular delta found under delta/force-app. Proceeding with validation..."
            sf project deploy start \
              --source-dir delta/force-app \
              --target-org sandbox \
              --dry-run \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          elif [ -d "delta/package" ] && [ "$(find delta/package -type f -name '*.xml' 2>/dev/null | wc -l)" -gt 0 ] && [ -z "$DC_FILE" ]; then
            echo "✅ Regular delta found under delta/package. Proceeding with validation..."
            sf project deploy start \
              --source-dir delta/package \
              --target-org sandbox \
              --dry-run \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          elif [ -n "$DC_FILE" ]; then
            echo "✅ Destructive changes found at: $DC_FILE"
            PKG_FILE=$(find delta -type f -name package.xml -print -quit || true)
            if [ -z "$PKG_FILE" ]; then
              echo "No package.xml found. Creating minimal package.xml at delta/package/package.xml"
              mkdir -p delta/package
              cat > delta/package/package.xml <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<Package xmlns="http://soap.sforce.com/2006/04/metadata">
  <version>58.0</version>
</Package>
EOF
              PKG_FILE=delta/package/package.xml
            fi

            echo "Using manifest: $PKG_FILE and post-destructive: $DC_FILE"
            sf project deploy start \
              --manifest "$PKG_FILE" \
              --post-destructive-changes "$DC_FILE" \
              --target-org sandbox \
              --dry-run \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          else
            echo "ℹ️ No deployable metadata found in delta. Skipping validation."
          fi

  deploy-to-sandbox:
    name: Deploy to Sandbox
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate Salesforce (Deploy)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > authFile.txt
          sf org login sfdx-url --sfdx-url-file authFile.txt --alias sandbox --set-default

      - name: Create Delta Output Directory
        run: mkdir -p delta

      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Delta using sfdx-git-delta (HEAD~1 to HEAD)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          sf sgd source delta \
            --from HEAD~1 \
            --to HEAD \
            -o delta \
            --generate-delta \
            -a 58.0 \
            -s force-app/

      - name: Debug: show delta tree and files
        run: |
          echo "=== delta directory listing ==="
          ls -R delta || true
          echo "=== show package.xml if present ==="
          [ -f delta/package/package.xml ] && sed -n '1,200p' delta/package/package.xml || echo "no package.xml"
          echo "=== find any destructiveChanges.xml files ==="
          find delta -type f -name "destructiveChanges*.xml" -print -exec sed -n '1,200p' {} \; || true

      - name: Deploy Delta to Sandbox (handles regular + destructive)
        run: |
          DC_FILE=$(find delta -type f -name 'destructiveChanges*.xml' -print -quit || true)
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "🚀 Regular delta found under delta/force-app. Deploying..."
            sf project deploy start \
              --source-dir delta/force-app \
              --target-org sandbox \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          elif [ -d "delta/package" ] && [ "$(find delta/package -type f -name '*.xml' 2>/dev/null | wc -l)" -gt 0 ] && [ -z "$DC_FILE" ]; then
            echo "🚀 Regular delta found under delta/package. Deploying..."
            sf project deploy start \
              --source-dir delta/package \
              --target-org sandbox \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          elif [ -n "$DC_FILE" ]; then
            echo "🚀 Destructive changes found at: $DC_FILE"
            PKG_FILE=$(find delta -type f -name package.xml -print -quit || true)
            if [ -z "$PKG_FILE" ]; then
              echo "No package.xml found. Creating minimal package.xml at delta/package/package.xml"
              mkdir -p delta/package
              cat > delta/package/package.xml <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<Package xmlns="http://soap.sforce.com/2006/04/metadata">
  <version>58.0</version>
</Package>
EOF
              PKG_FILE=delta/package/package.xml
            fi

            echo "Using manifest: $PKG_FILE and post-destructive: $DC_FILE"
            sf project deploy start \
              --manifest "$PKG_FILE" \
              --post-destructive-changes "$DC_FILE" \
              --target-org sandbox \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          else
            echo "ℹ️ No deployable metadata found. Skipping deployment."
          fi
