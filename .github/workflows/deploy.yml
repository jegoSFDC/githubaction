name: Salesforce CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  SEVERITY_THRESHOLD: 3  # High/Critical only (1=all, 2=medium+, 3=high+, 4=critical)
  COVERAGE_THRESHOLD: 75

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node & Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.sf
          key: sf-cli-${{ runner.os }}-${{ hashFiles('**/sfdx-project.json') }}
          restore-keys: |
            sf-cli-${{ runner.os }}-

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli --silent
          sf --version

      - name: Authenticate Salesforce (PR Validation)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > /tmp/authFile.txt
          sf org login sfdx-url --sfdx-url-file /tmp/authFile.txt --alias sandbox --set-default
          rm -f /tmp/authFile.txt

      - name: Create Delta Output Directory
        run: mkdir -p delta reports

      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Delta using sfdx-git-delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin ${{ github.base_ref }} --quiet
          echo "Generating delta from origin/${{ github.base_ref }} to HEAD"
          sf sgd source delta --to HEAD --from origin/${{ github.base_ref }} --output delta --generate-delta
          ls -la delta || true

      - name: Show Generated Package.xml Files
        run: |
          echo "=== Delta Directory Structure ==="
          find delta -type f | head -20 || echo "No delta files found"
          echo ""
          echo "=== Package.xml (if exists) ==="
          [ -f delta/package/package.xml ] && cat delta/package/package.xml || echo "No package.xml"
          echo ""
          echo "=== Destructive Changes (if exists) ==="
          find delta -name "destructiveChanges*.xml" -exec echo "Found: {}" \; -exec cat {} \; || echo "No destructive changes"

      - name: Run Salesforce Code Analyzer for Apex
        id: run-code-analyzer-apex
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >
            --target force-app/main/default/classes
            --view detail
            --output-file reports/apex.json
            --severity-threshold ${{ env.SEVERITY_THRESHOLD }}
          results-artifact-name: code-analyzer-apex-results
        continue-on-error: true

      - name: Run Salesforce Code Analyzer for LWC
        id: run-code-analyzer-lwc
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >
            --target force-app/main/default/lwc
            --view detail
            --output-file reports/lwc.json
            --severity-threshold ${{ env.SEVERITY_THRESHOLD }}
          results-artifact-name: code-analyzer-lwc-results
        continue-on-error: true

      - name: Upload Code Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analysis-reports
          path: reports/
          retention-days: 30

      - name: Display Code Analysis Results
        if: always()
        run: |
          echo "🔍 Static Code Analysis Results:"
          echo "=================================="
          
          # Ensure reports exist with fallback
          [ -f reports/apex.json ] || echo '{"violations":[]}' > reports/apex.json
          [ -f reports/lwc.json ] || echo '{"violations":[]}' > reports/lwc.json
          
          # Display Apex results with FIXED parsing
          if [ -f "reports/apex.json" ] && [ -s "reports/apex.json" ]; then
            echo "📊 Apex Analysis Results:"
            APEX_VIOLATIONS=$(jq '.violations | length' reports/apex.json 2>/dev/null || echo "0")
            if [ "$APEX_VIOLATIONS" -gt 0 ]; then
              echo "⚠️  Apex Violations: $APEX_VIOLATIONS found"
              echo "High Priority Issues:"
              # FIXED: Parse location field correctly - extract filename from location
              jq -r '.violations[]? | select(.severity <= 3) | 
                (if .location then (.location | split(":")[0] | split("/") | .[-1]) else "Unknown" end) as $file |
                "  • \($file) - \(.ruleName // "Unknown"): \(.message)"' reports/apex.json 2>/dev/null | head -10
            else
              echo "✅ No Apex violations found!"
            fi
          else
            echo "✅ No Apex violations found!"
          fi
          
          echo ""
          
          # Display LWC results with FIXED parsing
          if [ -f "reports/lwc.json" ] && [ -s "reports/lwc.json" ]; then
            echo "📊 LWC Analysis Results:"
            LWC_VIOLATIONS=$(jq '.violations | length' reports/lwc.json 2>/dev/null || echo "0")
            if [ "$LWC_VIOLATIONS" -gt 0 ]; then
              echo "⚠️  LWC Violations: $LWC_VIOLATIONS found"
              echo "Key Issues:"
              jq -r '.violations[]? | select(.severity <= 3) | 
                (if .location then (.location | split(":")[0] | split("/") | .[-1]) else "Unknown" end) as $file |
                "  • \($file) - \(.ruleName // "Unknown"): \(.message)"' reports/lwc.json 2>/dev/null | head -5
            else
              echo "✅ No LWC violations found!"
            fi
          else
            echo "✅ No LWC violations found!"
          fi

      - name: Analyze Delta and Map Test Classes
        id: analyze_delta
        run: |
          echo "🔍 Analyzing Apex classes in delta for test mapping..."
          
          # **FIXED: Only extract actual .cls files from delta, not from package.xml**
          APEX_CLASSES=$(find delta/force-app/main/default/classes -name '*.cls' -maxdepth 1 -exec basename {} .cls \; | tr '\n' ' ' | sed 's/ *$//')
          
          echo "📋 Found Apex classes in delta: ${APEX_CLASSES:-none}"
          
          TESTS_IN_DELTA=""
          PROD_CLASSES=""
          
          if [ -n "$APEX_CLASSES" ]; then
            for cls in $APEX_CLASSES; do
              file_path=$(find delta/force-app force-app -path "*/classes/${cls}.cls" 2>/dev/null | head -n1)
              if [ -z "$file_path" ]; then
                echo "  ⚠️  ${cls}: file not found in delta (treating as production)"
                PROD_CLASSES="$PROD_CLASSES $cls"
                continue
              fi
              
              if grep -qi "@isTest" "$file_path"; then
                echo "  ✓ ${cls}: test class"
                TESTS_IN_DELTA="$TESTS_IN_DELTA $cls"
              else
                echo "  ✓ ${cls}: production class"
                PROD_CLASSES="$PROD_CLASSES $cls"
              fi
            done
            
            TESTS_IN_DELTA=$(echo "$TESTS_IN_DELTA" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
            PROD_CLASSES=$(echo "$PROD_CLASSES" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
          fi
          
          echo ""
          echo "📊 Classification:"
          echo "  Production classes: ${PROD_CLASSES:-none}"
          echo "  Test classes: ${TESTS_IN_DELTA:-none}"
          echo ""
          
          # **IMPROVED: Map production classes to their test classes**
          RELATED_TESTS=""
          echo "{" > reports/test-mapping.json
          echo '  "mapping": [' >> reports/test-mapping.json
          SEP=""
          
          if [ -n "$PROD_CLASSES" ] && [ -n "$TESTS_IN_DELTA" ]; then
            for pc in $PROD_CLASSES; do
              FOUND=""
              for tc in $TESTS_IN_DELTA; do
                tf=$(find delta/force-app force-app -path "*/classes/${tc}.cls" 2>/dev/null | head -n1)
                if [ -n "$tf" ] && grep -qiE "(new[[:space:]]+${pc}\b|${pc}\.[A-Za-z_]|${pc}[[:space:]]*\()" "$tf"; then
                  FOUND="$FOUND $tc"
                fi
              done
              
              FOUND=$(echo "$FOUND" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
              [ -n "$FOUND" ] && RELATED_TESTS="$RELATED_TESTS $FOUND"
              
              if [ -n "$FOUND" ]; then
                JSON_TESTS=$(echo "$FOUND" | xargs -n1 | sed 's/^/"/;s/$/"/' | paste -sd, -)
              else
                JSON_TESTS=""
              fi
              
              echo "$SEP    {\"apexClass\": \"${pc}\", \"tests\": [${JSON_TESTS}]}" >> reports/test-mapping.json
              SEP=","
            done
          fi
          
          echo '  ]' >> reports/test-mapping.json
          echo '}' >> reports/test-mapping.json
          
          RELATED_TESTS=$(echo "$RELATED_TESTS" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
          
          echo ""
          echo "✅ Test mapping complete. Tests to run: ${RELATED_TESTS:-none (RunLocalTests fallback)}"
          
          echo "APEX_CLASSES=$APEX_CLASSES" >> $GITHUB_ENV
          echo "TESTS_IN_DELTA=$TESTS_IN_DELTA" >> $GITHUB_ENV
          echo "RELATED_TESTS=$RELATED_TESTS" >> $GITHUB_ENV

      - name: Validate with Intelligent Test Selection
        id: validate_deploy
        run: |
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            echo "Delta found. Proceeding with validation..."
            
            if find delta/force-app -name "*.cls" -o -name "*.trigger" | grep -q .; then
              echo "🔍 Found Apex files, running tests..."
              
              if [ -n "${RELATED_TESTS:-}" ]; then
                # **FIXED: Convert space-separated test list to comma-separated for sf CLI**
                RELATED_TESTS_CSV=$(echo "$RELATED_TESTS" | xargs -n1 | paste -sd, - || echo "")
                echo "✅ Running mapped tests: ${RELATED_TESTS_CSV}"
                
                # Run with specified tests first
                echo "🔄 Running deploy validation with mapped tests..."
                if sf project deploy start \
                  --source-dir delta/force-app \
                  --target-org sandbox \
                  --dry-run \
                  --test-level RunSpecifiedTests \
                  --tests "$RELATED_TESTS_CSV" \
                  --json > reports/deploy-report.json 2>&1; then
                  
                  echo "✅ Deploy validation completed successfully"
                else
                  echo "❌ Deploy validation failed with mapped tests!"
                  echo ""
                  echo "🔍 Detailed Error Information:"
                  echo "==============================================="
                  if [ -f "reports/deploy-report.json" ] && [ -s "reports/deploy-report.json" ]; then
                    # Extract and display actual error details from the JSON response
                    if jq -e '.result.details' reports/deploy-report.json > /dev/null 2>&1; then
                      echo "📋 Error Details:"
                      jq -r '.result.details | select(. != null) | to_entries[] | "  • \(.key): \(.value)"' reports/deploy-report.json 2>/dev/null || echo "  Could not parse error details"
                    fi

                    if jq -e '.result.details.componentFailures' reports/deploy-report.json > /dev/null 2>&1; then
                      echo ""
                      echo "🔧 Component Failures:"
                      jq -r '.result.details.componentFailures[]? | "  • \(.fileName // .name): \(.problem) (\(.problemType))"' reports/deploy-report.json 2>/dev/null | head -10
                    fi

                    if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json > /dev/null 2>&1; then
                      echo ""
                      echo "🧪 Test Failures:"
                      jq -r '.result.details.runTestResult.failures[]? | "  • \(.name): \(.message) (\(.methodName))"' reports/deploy-report.json 2>/dev/null | head -10
                    fi

                    if jq -e '.message' reports/deploy-report.json > /dev/null 2>&1; then
                      echo ""
                      echo "💬 Error Message:"
                      jq -r '.message' reports/deploy-report.json 2>/dev/null
                    fi
                  else
                    echo "📭 No detailed error information available in deploy report"
                    echo ""
                    echo "🔍 Raw command output (if available):"
                    cat reports/deploy-report.json 2>/dev/null || echo "  No output file found"
                  fi
                  echo "==============================================="
                  echo ""
                  echo "⚠️  Continuing to analyze results and will retry with fallback..."
                  
                  # Create a basic report structure for failed deployments
                  echo '{"result":{"status":"Failed","message":"Deploy validation failed with mapped tests"}}' > reports/deploy-report.json
                fi
                
                # **ADDED: Check coverage after running mapped tests**
                if [ -f "reports/deploy-report.json" ]; then
                  COVERAGE=$(jq -r '.result.details.runTestResult.codeCoverage[]? | .coveredPercent // 0' reports/deploy-report.json 2>/dev/null | awk '{sum += $1} END {print (NR > 0 ? sum/NR : 0)}' || echo "0")
                  COVERAGE=${COVERAGE%.*}  # Remove decimal part
                  
                  echo "📊 Coverage achieved: ${COVERAGE}%"
                  
                  if [ "$COVERAGE" -lt "${COVERAGE_THRESHOLD}" ]; then
                    echo "⚠️  Coverage ${COVERAGE}% below threshold ${COVERAGE_THRESHOLD}%. Retrying with RunLocalTests..."
                    
                    # Retry with all local tests to ensure sufficient coverage
                    echo "🔄 Running fallback deploy validation with all local tests..."
                    if sf project deploy start \
                      --source-dir delta/force-app \
                      --target-org sandbox \
                      --dry-run \
                      --test-level RunLocalTests \
                      --json > reports/deploy-report-coverage.json 2>&1; then
                      
                      echo "✅ Fallback deploy validation completed"
                    else
                      echo "❌ Fallback deploy validation also failed!"
                      echo ""
                      echo "🔍 Fallback Deployment Error Details:"
                      echo "==============================================="
                      if [ -f "reports/deploy-report-coverage.json" ] && [ -s "reports/deploy-report-coverage.json" ]; then
                        # Extract and display actual error details from the JSON response
                        if jq -e '.result.details' reports/deploy-report-coverage.json > /dev/null 2>&1; then
                          echo "📋 Error Details:"
                          jq -r '.result.details | select(. != null) | to_entries[] | "  • \(.key): \(.value)"' reports/deploy-report-coverage.json 2>/dev/null || echo "  Could not parse error details"
                        fi

                        if jq -e '.result.details.componentFailures' reports/deploy-report-coverage.json > /dev/null 2>&1; then
                          echo ""
                          echo "🔧 Component Failures:"
                          jq -r '.result.details.componentFailures[]? | "  • \(.fileName // .name): \(.problem) (\(.problemType))"' reports/deploy-report-coverage.json 2>/dev/null | head -10
                        fi

                        if jq -e '.result.details.runTestResult.failures' reports/deploy-report-coverage.json > /dev/null 2>&1; then
                          echo ""
                          echo "🧪 Test Failures:"
                          jq -r '.result.details.runTestResult.failures[]? | "  • \(.name): \(.message) (\(.methodName))"' reports/deploy-report-coverage.json 2>/dev/null | head -10
                        fi

                        if jq -e '.message' reports/deploy-report-coverage.json > /dev/null 2>&1; then
                          echo ""
                          echo "💬 Error Message:"
                          jq -r '.message' reports/deploy-report-coverage.json 2>/dev/null
                        fi
                      else
                        echo "📭 No detailed error information available in fallback deploy report"
                        echo ""
                        echo "🔍 Raw fallback command output (if available):"
                        cat reports/deploy-report-coverage.json 2>/dev/null || echo "  No output file found"
                      fi
                      echo "==============================================="
                      echo ""
                      echo '{"result":{"status":"Failed","message":"Both specified and local tests failed"}}' > reports/deploy-report-coverage.json
                    fi
                    
                    # Use the coverage run results
                    mv reports/deploy-report-coverage.json reports/deploy-report.json
                  else
                    echo "✅ Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
                  fi
                fi
              else
                echo "⚠️  No mapped tests found; running all local tests."
                echo "🔄 Running deploy validation with all local tests..."
                if sf project deploy start \
                  --source-dir delta/force-app \
                  --target-org sandbox \
                  --dry-run \
                  --test-level RunLocalTests \
                  --json > reports/deploy-report.json 2>&1; then
                  
                  echo "✅ Deploy validation completed successfully"
                else
                  echo "❌ Deploy validation failed with local tests!"
                  echo ""
                  echo "🔍 Local Tests Error Details:"
                  echo "==============================================="
                  if [ -f "reports/deploy-report.json" ] && [ -s "reports/deploy-report.json" ]; then
                    # Extract and display actual error details from the JSON response
                    if jq -e '.result.details' reports/deploy-report.json > /dev/null 2>&1; then
                      echo "📋 Error Details:"
                      jq -r '.result.details | select(. != null) | to_entries[] | "  • \(.key): \(.value)"' reports/deploy-report.json 2>/dev/null || echo "  Could not parse error details"
                    fi

                    if jq -e '.result.details.componentFailures' reports/deploy-report.json > /dev/null 2>&1; then
                      echo ""
                      echo "🔧 Component Failures:"
                      jq -r '.result.details.componentFailures[]? | "  • \(.fileName // .name): \(.problem) (\(.problemType))"' reports/deploy-report.json 2>/dev/null | head -10
                    fi

                    if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json > /dev/null 2>&1; then
                      echo ""
                      echo "🧪 Test Failures:"
                      jq -r '.result.details.runTestResult.failures[]? | "  • \(.name): \(.message) (\(.methodName))"' reports/deploy-report.json 2>/dev/null | head -10
                    fi

                    if jq -e '.message' reports/deploy-report.json > /dev/null 2>&1; then
                      echo ""
                      echo "💬 Error Message:"
                      jq -r '.message' reports/deploy-report.json 2>/dev/null
                    fi
                  else
                    echo "📭 No detailed error information available in deploy report"
                    echo ""
                    echo "🔍 Raw command output (if available):"
                    cat reports/deploy-report.json 2>/dev/null || echo "  No output file found"
                  fi
                  echo "==============================================="
                  echo ""
                  echo '{"result":{"status":"Failed","message":"Local tests failed"}}' > reports/deploy-report.json
                fi
              fi
            else
              echo "📦 No Apex files found, skipping test execution"
              sf project deploy start \
                --source-dir delta/force-app \
                --target-org sandbox \
                --dry-run \
                --test-level NoTestRun \
                --json > reports/deploy-report.json
            fi
          else
            echo "📭 No deployable metadata found in delta. Skipping validation."
            echo '{"result":{"status":"Skipped","message":"No changes to deploy"}}' > reports/deploy-report.json
          fi

      - name: Display Validation Summary
        if: always()
        run: |
          echo ""
          
          if [ -f reports/deploy-report.json ]; then
            STATUS=$(jq -r '.result.status // "Failed"' reports/deploy-report.json 2>/dev/null || echo "Failed")
            if [ "$STATUS" = "Succeeded" ]; then 
              echo "🚦 Validation Status: ✅ Succeeded"
            elif [ "$STATUS" = "Skipped" ]; then
              echo "🚦 Validation Status: ⚪ Skipped (no changes)"
            else 
              echo "🚦 Validation Status: ❌ Failed"
            fi
          else
            echo "🚦 Validation Status: ⚪ Skipped (no deploy report)"
          fi
          echo ""
          
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            echo "📦 Deployment Package Metadata:"
            echo "==============================================="
            
            COMPONENT_COUNT=0
            if [ -f "delta/package/package.xml" ]; then
              while IFS= read -r line; do
                if [[ $line =~ members\>([^<]+)\</members ]]; then
                  COMPONENT_COUNT=$((COMPONENT_COUNT + 1))
                  echo "$COMPONENT_COUNT. ${BASH_REMATCH[1]}"
                fi
              done < <(grep '<members>' delta/package/package.xml)
              
              if [ $COMPONENT_COUNT -gt 0 ]; then
                echo ""
                echo "✅ **Number of Components:** $COMPONENT_COUNT"
              fi
            else
              echo "❌ No package.xml found"
            fi
            echo ""
            
            echo "🎯 Coverage Analysis"
            if [ -f "reports/deploy-report.json" ]; then
              DEPLOY_STATUS=$(jq -r '.result.status // "Unknown"' reports/deploy-report.json 2>/dev/null || echo "Unknown")
              
              if [ "$DEPLOY_STATUS" = "Succeeded" ]; then
                echo "✅ **Validation Passed:** All tests and coverage requirements met"
              elif [ "$DEPLOY_STATUS" = "Skipped" ]; then
                echo "⚪ **No Testing Required:** No Apex changes detected"
              else
                echo "❌ **Validation Failed:** Check test execution and coverage"
                echo ""
                echo "🔍 **Detailed Error Analysis:**"
                echo "==============================================="

                # **ENHANCED: Comprehensive error extraction from failed deployments**
                if [ -f "reports/deploy-report.json" ] && [ -s "reports/deploy-report.json" ]; then

                  # Extract general error message if available
                  if jq -e '.message' reports/deploy-report.json > /dev/null 2>&1; then
                    echo "💬 **Error Message:**"
                    jq -r '.message' reports/deploy-report.json 2>/dev/null
                    echo ""
                  fi

                  # Extract component failures with more detail
                  if jq -e '.result.details.componentFailures' reports/deploy-report.json > /dev/null 2>&1; then
                    COMPONENT_COUNT=$(jq '.result.details.componentFailures | length' reports/deploy-report.json 2>/dev/null || echo "0")
                    echo "🔧 **Component Failures (${COMPONENT_COUNT}):**"
                    jq -r '.result.details.componentFailures[]? | "   • \(.fileName // .name): \(.problem) (\(.problemType))"' reports/deploy-report.json 2>/dev/null
                    echo ""
                  fi

                  # Extract test failures with more detail
                  if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json > /dev/null 2>&1; then
                    TEST_FAILURE_COUNT=$(jq '.result.details.runTestResult.failures | length' reports/deploy-report.json 2>/dev/null || echo "0")
                    echo "🧪 **Test Failures (${TEST_FAILURE_COUNT}):**"
                    jq -r '.result.details.runTestResult.failures[]? | "   • \(.name): \(.message) - Method: \(.methodName)"' reports/deploy-report.json 2>/dev/null
                    echo ""
                  fi

                  # Extract coverage information even from failed deployments
                  if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json > /dev/null 2>&1; then
                    COVERAGE=$(jq -r '.result.details.runTestResult.codeCoverage[]? | .coveredPercent // 0' reports/deploy-report.json 2>/dev/null | awk '{sum += $1} END {print (NR > 0 ? sum/NR : 0)}' || echo "0")
                    COVERAGE=${COVERAGE%.*}
                    echo "📊 **Coverage Achieved:** ${COVERAGE}%"
                    
                    # Show per-class coverage for more insight
                    if jq -e '.result.details.runTestResult.codeCoverage[]? | .name' reports/deploy-report.json > /dev/null 2>&1; then
                      echo "   **Per-Class Coverage:**"
                      jq -r '.result.details.runTestResult.codeCoverage[]? | "     • \(.name): \(.coveredPercent)%"' reports/deploy-report.json 2>/dev/null | head -10
                    fi
                    echo ""
                  fi

                  # Extract any other error details
                  if jq -e '.result.details | length' reports/deploy-report.json > /dev/null 2>&1; then
                    DETAILS_COUNT=$(jq '.result.details | length' reports/deploy-report.json 2>/dev/null || echo "0")
                    if [ "$DETAILS_COUNT" -gt 0 ]; then
                      echo "📋 **Additional Error Details:**"
                      jq -r '.result.details | select(. != null) | to_entries[] | select(.key != "componentFailures" and .key != "runTestResult") | "   • \(.key): \(.value)"' reports/deploy-report.json 2>/dev/null
                      echo ""
                    fi
                  fi

                  # If no specific error details found, show raw output
                  if ! jq -e '.result.details' reports/deploy-report.json > /dev/null 2>&1; then
                    echo "ℹ️  **No detailed failure information available in deploy report**"
                    echo ""
                    echo "🔍 **Raw Error Output:**"
                    jq -r '.' reports/deploy-report.json 2>/dev/null || echo "Could not parse JSON output"
                    echo ""
                  fi

                else
                  echo "📭 **No deploy report found to analyze errors**"
                  echo ""
                fi

                echo "==============================================="
              fi
            fi
            echo ""
            
            echo "🔍 Static Code Analysis"
            APEX_VIOLATIONS=$(jq '.violations | length' reports/apex.json 2>/dev/null || echo "0")
            LWC_VIOLATIONS=$(jq '.violations | length' reports/lwc.json 2>/dev/null || echo "0")
            TOTAL_VIOLATIONS=$((APEX_VIOLATIONS + LWC_VIOLATIONS))
            
            if [ $TOTAL_VIOLATIONS -eq 0 ]; then
              echo "✅ Code Quality: Excellent (0 violations)"
            elif [ $TOTAL_VIOLATIONS -le 5 ]; then
              echo "🟡 Code Quality: Good ($TOTAL_VIOLATIONS violations)"
            else
              echo "🔴 Code Quality: Needs Attention ($TOTAL_VIOLATIONS violations)"
            fi
            
          else
            echo "📌 Validation Status: Skipped"
            echo "ℹ️  Reason: No deployable metadata found in delta"
            echo ""
            echo "🔍 Static Code Analysis: ✅ No violations"
            echo "📊 Code Quality: 🟢 Excellent (0 violations)"
          fi
