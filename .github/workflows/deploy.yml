name: Salesforce CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate Salesforce (PR Validation)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > authFile.txt
          sf org login sfdx-url --sfdx-url-file authFile.txt --alias sandbox --set-default

      - name: Create Delta Output Directory
        run: mkdir -p delta

      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Delta using sfdx-git-delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          sf sgd source delta \
            --from origin/main \
            --to HEAD \
            -o delta \
            --generate-delta \
            -a 58.0 \
            -s force-app/

      - name: Debug Delta Generation
        run: |
          echo "=== Delta Directory Contents ==="
          find delta/ -type f 2>/dev/null || echo "No delta directory found"
          echo "=== Force-app Contents ==="
          find delta/force-app -type f 2>/dev/null || echo "No force-app in delta"
          echo "=== File Count ==="
          find delta/force-app -type f 2>/dev/null | wc -l || echo "0"

      - name: Validate Delta Deployment with Specific Test Class
        run: |
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✅ Delta found. Proceeding with validation..."
            sf project deploy start \
              --source-dir delta/force-app \
              --target-org sandbox \
              --dry-run \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          else
            echo "ℹ️ No deployable metadata found in delta. Skipping validation."
          fi

  deploy-to-sandbox:
    name: Deploy to Sandbox
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate Salesforce (Deploy)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > authFile.txt
          sf org login sfdx-url --sfdx-url-file authFile.txt --alias sandbox --set-default

      - name: Create Delta Output Directory
        run: mkdir -p delta

      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Delta using sfdx-git-delta (HEAD~1 to HEAD)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin main
          sf sgd source delta \
            --from HEAD~1 \
            --to HEAD \
            -o delta \
            --generate-delta \
            -a 58.0 \
            -s force-app/

      - name: Debug Delta Generation
        run: |
          echo "=== Delta Directory Contents ==="
          find delta/ -type f 2>/dev/null || echo "No delta directory found"
          echo "=== Force-app Contents ==="
          find delta/force-app -type f 2>/dev/null || echo "No force-app in delta"
          echo "=== File Count ==="
          find delta/force-app -type f 2>/dev/null | wc -l || echo "0"

      - name: Deploy Delta to Sandbox with Specific Test Class
        run: |
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "🚀 Deployable delta found. Deploying..."
            sf project deploy start \
              --source-dir delta/force-app \
              --target-org sandbox \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          else
            echo "ℹ️ No deployable metadata found. Skipping deployment."
          fi
