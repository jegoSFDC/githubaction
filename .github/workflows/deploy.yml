name: Salesforce CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Authenticate to Salesforce
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > authfile.txt
          sf org login sfdx-url --sfdx-url-file authfile.txt --set-default --alias devorg

      - name: Generate Delta Package
        run: |
          # Create delta directory (CRITICAL FIX)
          mkdir -p delta
          
          BASE=origin/${{ github.event.pull_request.base.ref }}
          HEAD=${{ github.event.pull_request.head.sha }}
          echo "Comparing $BASE -> $HEAD"
          
          # Fetch base branch for comparison
          git fetch origin ${{ github.event.pull_request.base.ref }} --no-tags --prune || true
          
          # Use explicit source directory for better metadata detection
          sf sgd source delta \
            --from "$BASE" \
            --to "$HEAD" \
            --output delta \
            --generate-delta \
            -a 58.0 \
            -s force-app/main/default

      - name: Debug Delta Contents
        run: |
          echo "=== Delta Directory Structure ==="
          find delta -type f | head -20 || echo "No delta files found"
          echo ""
          echo "=== Package.xml (if exists) ==="
          [ -f delta/package/package.xml ] && cat delta/package/package.xml || echo "No package.xml"
          echo ""
          echo "=== Destructive Changes (if exists) ==="
          find delta -name "destructiveChanges*.xml" -exec echo "Found: {}" \; -exec cat {} \; || echo "No destructive changes"
          echo ""
          echo "=== Git Diff for Debug ==="
          git diff --name-only origin/${{ github.event.pull_request.base.ref }} ${{ github.event.pull_request.head.sha }} || true

      - name: Run PMD Static Analysis
        uses: pmd/pmd-github-action@v2
        with:
          rulesets: 'rulesets/apex/security.xml'
          sourcePath: 'force-app/main/default'
          analyzeModifiedFilesOnly: true

      - name: Validate Delta Deployment (dry-run)
        run: |
          # Check for destructive changes
          DC_FILE=$(find delta -name 'destructiveChanges*.xml' -print -quit || true)
          
          if [ -n "$DC_FILE" ]; then
            echo "🚨 Destructive changes found: $DC_FILE"
            # Find or create package.xml
            PKG_FILE=$(find delta -name package.xml -print -quit || true)
            if [ -z "$PKG_FILE" ]; then
              echo "Creating minimal package.xml"
              mkdir -p delta/package
              echo '<?xml version="1.0" encoding="UTF-8"?>' > delta/package/package.xml
              echo '<Package xmlns="http://soap.sforce.com/2006/04/metadata">' >> delta/package/package.xml
              echo '  <version>58.0</version>' >> delta/package/package.xml
              echo '</Package>' >> delta/package/package.xml
              PKG_FILE=delta/package/package.xml
            fi
            
            echo "Deploying with destructive changes..."
            sf project deploy start \
              --manifest "$PKG_FILE" \
              --post-destructive-changes "$DC_FILE" \
              --target-org devorg \
              --dry-run \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          elif [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            echo "✅ Regular changes found in delta/force-app"
            sf project deploy start \
              --source-dir delta/force-app \
              --target-org devorg \
              --dry-run \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          else
            echo "ℹ️ No deployable changes found in delta"
          fi

  deploy-to-sandbox:
    name: Deploy to Sandbox
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node & Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Install SFDX Git Delta
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Authenticate to Salesforce
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > authfile.txt
          sf org login sfdx-url --sfdx-url-file authfile.txt --set-default --alias sandbox

      - name: Generate Delta Package
        run: |
          # Create delta directory (CRITICAL FIX)
          mkdir -p delta
          
          echo "Comparing HEAD~1 -> HEAD"
          git fetch origin main --no-tags --prune || true
          
          # Use explicit source directory for better metadata detection
          sf sgd source delta \
            --from HEAD~1 \
            --to HEAD \
            --output delta \
            --generate-delta \
            -a 58.0 \
            -s force-app/main/default

      - name: Debug Delta Contents
        run: |
          echo "=== Delta Directory Structure ==="
          find delta -type f | head -20 || echo "No delta files found"
          echo ""
          echo "=== Package.xml (if exists) ==="
          [ -f delta/package/package.xml ] && cat delta/package/package.xml || echo "No package.xml"
          echo ""
          echo "=== Destructive Changes (if exists) ==="
          find delta -name "destructiveChanges*.xml" -exec echo "Found: {}" \; -exec cat {} \; || echo "No destructive changes"
          echo ""
          echo "=== Git Diff for Debug ==="
          git diff --name-only HEAD~1 HEAD || true

      - name: Deploy Delta to Sandbox
        run: |
          # Check for destructive changes
          DC_FILE=$(find delta -name 'destructiveChanges*.xml' -print -quit || true)
          
          if [ -n "$DC_FILE" ]; then
            echo "🚨 Destructive changes found: $DC_FILE"
            # Find or create package.xml
            PKG_FILE=$(find delta -name package.xml -print -quit || true)
            if [ -z "$PKG_FILE" ]; then
              echo "Creating minimal package.xml"
              mkdir -p delta/package
              echo '<?xml version="1.0" encoding="UTF-8"?>' > delta/package/package.xml
              echo '<Package xmlns="http://soap.sforce.com/2006/04/metadata">' >> delta/package/package.xml
              echo '  <version>58.0</version>' >> delta/package/package.xml
              echo '</Package>' >> delta/package/package.xml
              PKG_FILE=delta/package/package.xml
            fi
            
            echo "Deploying with destructive changes..."
            sf project deploy start \
              --manifest "$PKG_FILE" \
              --post-destructive-changes "$DC_FILE" \
              --target-org sandbox \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          elif [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            echo "✅ Regular changes found in delta/force-app"
            sf project deploy start \
              --source-dir delta/force-app \
              --target-org sandbox \
              --test-level RunSpecifiedTests \
              --tests "ChangePasswordControllerTest" \
              --verbose
          else
            echo "ℹ️ No deployable changes found in delta"
          fi

      - name: Post-Deployment Validation
        run: |
          echo "🔍 Running post-deployment validation..."
          sf apex run test \
            --target-org sandbox \
            --test-level RunSpecifiedTests \
            --tests "ChangePasswordControllerTest" \
            --result-format human \
            --verbose
