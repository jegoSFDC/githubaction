name: EPC Deployment on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

jobs:
  deploy-vlocity-epc:
    name: Deploy EPC Metadata (PR Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI (sf)
        run: npm install -g @salesforce/cli

      - name: Install Vlocity CLI
        run: npm install -g vlocity

      - name: Create JWT Server Key File
        run: echo "${{ secrets.SF_VLOCITYSANDBOX_AUTH_URL }}" > server.key

      - name: Authenticate Salesforce via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url ${{ secrets.SF_LOGIN_URL }} \
            --set-default \
            --alias vlocity-jwt-org

      - name: Run Vlocity EPC Deployment
        run: |
          if [ -f "epc-deploy.yaml" ]; then
            echo "Running EPC Vlocity Deployment..."
            vlocity -job epc-deploy.yaml --salesforce.username "${{ secrets.SF_USERNAME }}" packDeploy
          else
            echo "epc-deploy.yaml not found. Skipping deployment."
          fi
