name: EPC Deployment on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop

jobs:
  deploy-vlocity-epc:
    name: Deploy EPC Metadata (PR Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Capture Start Time
        run: echo "PIPELINE_START=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI (sf)
        run: npm install -g @salesforce/cli

      - name: Install Vlocity CLI
        run: npm install -g vlocity

      - name: Mark GitHub workspace as safe
        run: git config --global --add safe.directory /__w/githubaction/githubaction

      - name: Install Puppeteer globally (for LWC activation)
        run: npm install -g puppeteer

      - name: Install Java (required for PMD)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and extract PMD
        run: |
          curl -L -o pmd.zip https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip
          unzip pmd.zip -d pmd
          ls pmd

      - name: Run PMD Static Code Analysis on Apex
        run: |
          ./pmd/pmd-bin-6.55.0/bin/run.sh pmd \
            -d force-app/main/default/classes \
            -f text \
            -R apex-security,apex-design

      - name: Create JWT Server Key File
        run: echo "${{ secrets.SF_VLOCITYSANDBOX_AUTH_URL }}" > server.key

      - name: Authenticate Salesforce via JWT
        run: |
          sf org login jwt \
            --client-id ${{ secrets.SF_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instance-url ${{ secrets.SF_LOGIN_URL }} \
            --set-default \
            --alias vlocity-jwt-org

      - name: Run Vlocity EPC Deployment
        run: |
          if [ -f "epc-deploy.yaml" ]; then
            echo "Running EPC Vlocity Deployment..."
            vlocity -job epc-deploy.yaml -sfdx.username "${{ secrets.SF_USERNAME }}" packDeploy
          else
            echo "epc-deploy.yaml not found. Skipping deployment."
          fi

      - name: Report Deployment Status (Success)
        if: ${{ success() }}
        run: echo "::notice::dora_deployment_status=success"

      - name: Report Deployment Status (Failure)
        if: ${{ failure() }}
        run: echo "::error::dora_deployment_status=failure"

      - name: Generate DORA Metrics Report
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME=$PIPELINE_START
          DURATION=$((END_TIME - START_TIME))
          STATUS="${{ job.status }}"
          
          echo "Deployment Duration: $DURATION seconds" > dora-metrics.txt
          echo "Deployment Status: $STATUS" >> dora-metrics.txt
          echo "Timestamp: $(date -u)" >> dora-metrics.txt

      - name: Upload DORA Metrics Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics-report
          path: dora-metrics.txt
