          # Run PMD analysis on Apex classes with best practices rules
          echo ""
          echo "🔍 Running PMD Best Practices Analysis on Apex Classes..."
          if [ -d "force-app/main/default/classes" ]; then
            pmd -d force-app/main/default/classes \
                -R rulesets/apex/bestpractices.xml \
                -f text \
                --fail-on-violation false \
                --report-file pmd-bestpractices-report.txt || echo "PMD best practices analysis completed with findings"
            
            # Display results
            echo "📊 PMD Best Practices Analysis Results:"
            if [ -f "pmd-bestpractices-report.txt" ] && [ -s "pmd-bestpractices-report.txt" ]; then
              echo "⚠️  Best practice violations found:"
              cat pmd-bestpractices-report.txt
            else
