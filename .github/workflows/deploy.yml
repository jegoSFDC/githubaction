name: Salesforce CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  SEVERITY_THRESHOLD: 3  # High/Critical only (1=all, 2=medium+, 3=high+, 4=critical)
  COVERAGE_THRESHOLD: 75

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node & Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.sf
          key: sf-cli-${{ runner.os }}-${{ hashFiles('**/sfdx-project.json') }}
          restore-keys: |
            sf-cli-${{ runner.os }}-

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli --silent
          sf --version

      - name: Authenticate Salesforce (PR Validation)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > /tmp/authFile.txt
          sf org login sfdx-url --sfdx-url-file /tmp/authFile.txt --alias sandbox --set-default
          rm -f /tmp/authFile.txt

      - name: Create Delta Output Directory
        run: mkdir -p delta reports

      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Delta using sfdx-git-delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin ${{ github.base_ref }} --quiet
          echo "Generating delta from origin/${{ github.base_ref }} to HEAD"
          sf sgd source delta --to HEAD --from origin/${{ github.base_ref }} --output delta --generate-delta
          ls -la delta || true

      - name: Show Generated Package.xml Files
        run: |
          echo "=== Delta Directory Structure ==="
          find delta -type f | head -20 || echo "No delta files found"
          echo ""
          echo "=== Package.xml (if exists) ==="
          [ -f delta/package/package.xml ] && cat delta/package/package.xml || echo "No package.xml"
          echo ""
          echo "=== Destructive Changes (if exists) ==="
          find delta -name "destructiveChanges*.xml" -exec echo "Found: {}" \; -exec cat {} \; || echo "No destructive changes"

      - name: Run Salesforce Code Analyzer for Apex
        id: run-code-analyzer-apex
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >
            --target force-app/main/default/classes
            --view detail
            --output-file reports/apex.json
            --severity-threshold ${{ env.SEVERITY_THRESHOLD }}
          results-artifact-name: code-analyzer-apex-results
        continue-on-error: true

      - name: Run Salesforce Code Analyzer for LWC
        id: run-code-analyzer-lwc
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >
            --target force-app/main/default/lwc
            --view detail
            --output-file reports/lwc.json
            --severity-threshold ${{ env.SEVERITY_THRESHOLD }}
          results-artifact-name: code-analyzer-lwc-results
        continue-on-error: true

      - name: Upload Code Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analysis-reports
          path: reports/
          retention-days: 30

      - name: Display Code Analysis Results
        if: always()
        run: |
          echo "🔍 Static Code Analysis Results:"
          echo "=================================="
          
          # Ensure reports exist with fallback
          [ -f reports/apex.json ] || echo '{"violations":[]}' > reports/apex.json
          [ -f reports/lwc.json ] || echo '{"violations":[]}' > reports/lwc.json
          
          # Display Apex results with FIXED parsing
          if [ -f "reports/apex.json" ] && [ -s "reports/apex.json" ]; then
            echo "📊 Apex Analysis Results:"
            APEX_VIOLATIONS=$(jq '.violations | length' reports/apex.json 2>/dev/null || echo "0")
            if [ "$APEX_VIOLATIONS" -gt 0 ]; then
              echo "⚠️  Apex Violations: $APEX_VIOLATIONS found"
              echo "High Priority Issues:"
              jq -r '.violations[]? | select(.severity <= 3) | 
                (if .location then (.location | split(":")[0] | split("/") | .[-1]) else "Unknown" end) as $file |
                "  • \($file) - \(.ruleName // "Unknown"): \(.message)"' reports/apex.json 2>/dev/null | head -10
            else
              echo "✅ No Apex violations found!"
            fi
          else
            echo "✅ No Apex violations found!"
          fi
          
          echo ""
          
          # Display LWC results with FIXED parsing
          if [ -f "reports/lwc.json" ] && [ -s "reports/lwc.json" ]; then
            echo "📊 LWC Analysis Results:"
            LWC_VIOLATIONS=$(jq '.violations | length' reports/lwc.json 2>/dev/null || echo "0")
            if [ "$LWC_VIOLATIONS" -gt 0 ]; then
              echo "⚠️  LWC Violations: $LWC_VIOLATIONS found"
              echo "Key Issues:"
              jq -r '.violations[]? | select(.severity <= 3) | 
                (if .location then (.location | split(":")[0] | split("/") | .[-1]) else "Unknown" end) as $file |
                "  • \($file) - \(.ruleName // "Unknown"): \(.message)"' reports/lwc.json 2>/dev/null | head -5
            else
              echo "✅ No LWC violations found!"
            fi
          else
            echo "✅ No LWC violations found!"
          fi

      - name: Analyze Delta and Map Test Classes
        id: analyze_delta
        run: |
          echo "🔍 Analyzing Apex classes in delta for test mapping..."
          
          # Only extract actual .cls files from delta
          APEX_CLASSES=$(find delta/force-app/main/default/classes -name '*.cls' -maxdepth 1 -exec basename {} .cls \; | tr '\n' ' ' | sed 's/ *$//')
          
          echo "📋 Found Apex classes in delta: ${APEX_CLASSES:-none}"
          
          TESTS_IN_DELTA=""
          PROD_CLASSES=""
          
          if [ -n "$APEX_CLASSES" ]; then
            for cls in $APEX_CLASSES; do
              file_path=$(find delta/force-app force-app -path "*/classes/${cls}.cls" 2>/dev/null | head -n1)
              if [ -z "$file_path" ]; then
                echo "  ⚠️  ${cls}: file not found in delta (treating as production)"
                PROD_CLASSES="$PROD_CLASSES $cls"
                continue
              fi
              
              if grep -qi "@isTest" "$file_path"; then
                echo "  ✓ ${cls}: test class"
                TESTS_IN_DELTA="$TESTS_IN_DELTA $cls"
              else
                echo "  ✓ ${cls}: production class"
                PROD_CLASSES="$PROD_CLASSES $cls"
              fi
            done
            
            TESTS_IN_DELTA=$(echo "$TESTS_IN_DELTA" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
            PROD_CLASSES=$(echo "$PROD_CLASSES" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
          fi
          
          echo ""
          echo "📊 Classification:"
          echo "  Production classes: ${PROD_CLASSES:-none}"
          echo "  Test classes: ${TESTS_IN_DELTA:-none}"
          echo ""
          
          # Map production classes to their test classes
          RELATED_TESTS=""
          echo "{" > reports/test-mapping.json
          echo '  "mapping": [' >> reports/test-mapping.json
          SEP=""
          
          if [ -n "$PROD_CLASSES" ] && [ -n "$TESTS_IN_DELTA" ]; then
            for pc in $PROD_CLASSES; do
              FOUND=""
              for tc in $TESTS_IN_DELTA; do
                tf=$(find delta/force-app force-app -path "*/classes/${tc}.cls" 2>/dev/null | head -n1)
                if [ -n "$tf" ] && grep -qiE "(new[[:space:]]+${pc}\b|${pc}\.[A-Za-z_]|${pc}[[:space:]]*\()" "$tf"; then
                  FOUND="$FOUND $tc"
                fi
              done
              
              FOUND=$(echo "$FOUND" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
              [ -n "$FOUND" ] && RELATED_TESTS="$RELATED_TESTS $FOUND"
              
              if [ -n "$FOUND" ]; then
                JSON_TESTS=$(echo "$FOUND" | xargs -n1 | sed 's/^/"/;s/$/"/' | paste -sd, -)
              else
                JSON_TESTS=""
              fi
              
              echo "$SEP    {\"apexClass\": \"${pc}\", \"tests\": [${JSON_TESTS}]}" >> reports/test-mapping.json
              SEP=","
            done
          fi
          
          echo '  ]' >> reports/test-mapping.json
          echo '}' >> reports/test-mapping.json
          
          RELATED_TESTS=$(echo "$RELATED_TESTS" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
          
          echo ""
          echo "✅ Test mapping complete. Tests to run: ${RELATED_TESTS:-none (RunLocalTests fallback)}"
          
          echo "APEX_CLASSES=$APEX_CLASSES" >> $GITHUB_ENV
          echo "TESTS_IN_DELTA=$TESTS_IN_DELTA" >> $GITHUB_ENV
          echo "RELATED_TESTS=$RELATED_TESTS" >> $GITHUB_ENV

      - name: Validate with Intelligent Test Selection
        id: validate_deploy
        run: |
          #!/usr/bin/env bash
          set -uo pipefail

          mkdir -p reports
          # default report if nothing else writes one
          echo '{"result":{"status":"Failed","message":"No deploy run performed"}}' > reports/deploy-report.json
          echo "" > reports/validation-summary.txt

          # helper to write short summary lines
          summary() { echo "$1" | tee -a reports/validation-summary.txt; }

          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            summary "Delta found: deployable metadata present."

            if find delta/force-app -name "*.cls" -o -name "*.trigger" | grep -q .; then
              summary "Apex changes detected: will run tests."

              # prefer mapped tests if any
              if [ -n "${RELATED_TESTS:-}" ]; then
                RELATED_TESTS_CSV=$(echo "$RELATED_TESTS" | xargs -n1 | paste -sd, - || echo "")
                summary "Using mapped tests: ${RELATED_TESTS_CSV}"

                # Run deploy validation with mapped tests
                if sf project deploy start \
                  --source-dir delta/force-app \
                  --target-org sandbox \
                  --dry-run \
                  --test-level RunSpecifiedTests \
                  --tests "$RELATED_TESTS_CSV" \
                  --json > reports/deploy-report.json 2>&1; then
                  summary "Mapped-tests deploy validation: Succeeded"
                else
                  summary "Mapped-tests deploy validation: Failed (see reports/deploy-report.json). Will retry with RunLocalTests."
                  # keep reports/deploy-report.json (contains CLI output) and fallback below
                fi

                # compute coverage if available
                COVERAGE=0
                if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
                  COVERAGE=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' reports/deploy-report.json 2>/dev/null || echo "0")
                  COVERAGE=${COVERAGE%.*}
                  summary "Coverage from mapped-tests run: ${COVERAGE}%"
                fi

                # fallback if coverage below threshold or mapped run failed (status != Succeeded)
                STATUS=$(jq -r '.result.status // "Failed"' reports/deploy-report.json 2>/dev/null || echo "Failed")
                if [ "$STATUS" != "Succeeded" ] || [ "${COVERAGE:-0}" -lt "${COVERAGE_THRESHOLD}" ]; then
                  summary "Triggering fallback: RunLocalTests (either mapped run failed or coverage < ${COVERAGE_THRESHOLD}%)."
                  if sf project deploy start \
                    --source-dir delta/force-app \
                    --target-org sandbox \
                    --dry-run \
                    --test-level RunLocalTests \
                    --json > reports/deploy-report-coverage.json 2>&1; then
                    summary "Fallback RunLocalTests: Succeeded"
                    mv reports/deploy-report-coverage.json reports/deploy-report.json
                  else
                    summary "Fallback RunLocalTests: Failed (see reports/deploy-report-coverage.json)"
                    mv reports/deploy-report-coverage.json reports/deploy-report.json || true
                  fi
                fi

              else
                # no mapped tests, run all local tests
                summary "No mapped tests found; running RunLocalTests."
                if sf project deploy start \
                  --source-dir delta/force-app \
                  --target-org sandbox \
                  --dry-run \
                  --test-level RunLocalTests \
                  --json > reports/deploy-report.json 2>&1; then
                  summary "RunLocalTests deploy validation: Succeeded"
                else
                  summary "RunLocalTests deploy validation: Failed (see reports/deploy-report.json)"
                fi
              fi

            else
              summary "No Apex files found in delta: deploying with NoTestRun."
              if sf project deploy start \
                --source-dir delta/force-app \
                --target-org sandbox \
                --dry-run \
                --test-level NoTestRun \
                --json > reports/deploy-report.json 2>&1; then
                summary "NoTestRun deploy validation: Succeeded"
              else
                summary "NoTestRun deploy validation: Failed (see reports/deploy-report.json)"
              fi
            fi
          else
            summary "No deployable metadata found in delta. Skipping validation."
            echo '{"result":{"status":"Skipped","message":"No changes to deploy"}}' > reports/deploy-report.json
          fi

          # Build compact human-readable validation summary (one-liner counts + coverage)
          STATUS=$(jq -r '.result.status // "Failed"' reports/deploy-report.json 2>/dev/null || echo "Failed")
          COMPONENT_FAIL_COUNT=0
          if jq -e '.result.details.componentFailures' reports/deploy-report.json >/dev/null 2>&1; then
            COMPONENT_FAIL_COUNT=$(jq '.result.details.componentFailures | length' reports/deploy-report.json 2>/dev/null || echo "0")
          fi
          TEST_FAIL_COUNT=0
          if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json >/dev/null 2>&1; then
            TEST_FAIL_COUNT=$(jq '.result.details.runTestResult.failures | length' reports/deploy-report.json 2>/dev/null || echo "0")
          fi
          COVERAGE=0
          if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
            COVERAGE=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' reports/deploy-report.json 2>/dev/null || echo "0")
            COVERAGE=${COVERAGE%.*}
          fi

          echo "" >> reports/validation-summary.txt
          echo "=== DEPLOY VALIDATION SUMMARY ===" >> reports/validation-summary.txt
          echo "Status: ${STATUS}" >> reports/validation-summary.txt
          echo "Component failures: ${COMPONENT_FAIL_COUNT}" >> reports/validation-summary.txt
          echo "Test failures: ${TEST_FAIL_COUNT}" >> reports/validation-summary.txt
          echo "Average coverage: ${COVERAGE}%" >> reports/validation-summary.txt
          echo "================================" >> reports/validation-summary.txt

          # Also print a short summary to job log (human friendly)
          echo ""
          echo "🔎 Validation summary (short):"
          echo "  • Status: ${STATUS}"
          echo "  • Component failures: ${COMPONENT_FAIL_COUNT}"
          echo "  • Test failures: ${TEST_FAIL_COUNT}"
          echo "  • Coverage: ${COVERAGE}% (threshold: ${COVERAGE_THRESHOLD}%)"
          if [ "${COMPONENT_FAIL_COUNT}" -gt 0 ] || [ "${TEST_FAIL_COUNT}" -gt 0 ] || [ "${COVERAGE}" -lt "${COVERAGE_THRESHOLD}" ]; then
            echo "⚠️  Validation issues detected. See reports/deploy-report.json and reports/validation-summary.txt for details."

            # === PRINT ACTUAL TEST FAILURES (exact lines) ===
            if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json >/dev/null 2>&1; then
              echo ""
              echo "🧪 Test Failures (full details):"
              # Print exact failure lines; sanitize HTML <br> to newline for readability
              jq -r '.result.details.runTestResult.failures[]? |
                ("\(.name): \(.message) (Method: \(.methodName // "unknown"))" )' reports/deploy-report.json 2>/dev/null | sed 's/<br>/\\n/g' | sed 's/\\n/\
/g' || true
            fi

            # === PRINT ACTUAL COMPONENT FAILURES (exact lines) ===
            if jq -e '.result.details.componentFailures' reports/deploy-report.json >/dev/null 2>&1; then
              echo ""
              echo "🔧 Component Failures (full details):"
              jq -r '.result.details.componentFailures[]? |
                "  - \(.fileName // .name): \(.problem) (\(.problemType // "Unknown"))"' reports/deploy-report.json 2>/dev/null | head -20 || true
            fi

            # === PRINT PROBLEMATIC componentSuccesses (only items with a non-empty problem and not just Info) ===
            if jq -e '.result.details.componentSuccesses' reports/deploy-report.json >/dev/null 2>&1; then
              PROBLEMS=$(jq -r '.result.details.componentSuccesses[]? |
                select((.problem != null and (.problem|tostring) != "" ) and (.problemType // "") != "Info") |
                "  - \(.fileName // .fullName // "unknown"): \(.problem) (\(.problemType // "Unknown"))"' reports/deploy-report.json 2>/dev/null || echo "")
              if [ -n "$PROBLEMS" ]; then
                echo ""
                echo "⚠️ Problematic component messages:"
                echo "$PROBLEMS"
              fi
            fi

            # === PRINT per-class coverage (only numeric values) ===
            if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
              echo ""
              echo "📊 Per-class coverage (numeric only):"
              jq -r '.result.details.runTestResult.codeCoverage[]? |
                select(.coveredPercent != null) |
                "  - \(.name): \(.coveredPercent)%"' reports/deploy-report.json 2>/dev/null | head -20 || true
            fi

          else
            echo "✅ Validation looks good."
          fi

          # leave detailed JSON reports and the concise validation-summary.txt as artifacts

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            reports/deploy-report.json
            reports/validation-summary.txt
            reports/test-mapping.json
            reports/apex.json
            reports/lwc.json
          retention-days: 30

      - name: Display Validation Summary
        if: always()
        run: |
          echo ""
          
          if [ -f reports/deploy-report.json ]; then
            STATUS=$(jq -r '.result.status // "Failed"' reports/deploy-report.json 2>/dev/null || echo "Failed")
            if [ "$STATUS" = "Succeeded" ]; then 
              echo "🚦 Validation Status: ✅ Succeeded"
            elif [ "$STATUS" = "Skipped" ]; then
              echo "🚦 Validation Status: ⚪ Skipped (no changes)"
            else 
              echo "🚦 Validation Status: ❌ Failed"
            fi
          else
            echo "🚦 Validation Status: ⚪ Skipped (no deploy report)"
          fi
          echo ""
          
          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            echo "📦 Deployment Package Metadata:"
            echo "==============================================="
            
            COMPONENT_COUNT=0
            if [ -f "delta/package/package.xml" ]; then
              while IFS= read -r line; do
                if [[ $line =~ members\>([^<]+)\</members ]]; then
                  COMPONENT_COUNT=$((COMPONENT_COUNT + 1))
                  echo "$COMPONENT_COUNT. ${BASH_REMATCH[1]}"
                fi
              done < <(grep '<members>' delta/package/package.xml)
              
              if [ $COMPONENT_COUNT -gt 0 ]; then
                echo ""
                echo "✅ **Number of Components:** $COMPONENT_COUNT"
              fi
            else
              echo "❌ No package.xml found"
            fi
            echo ""
            
            echo "🎯 Coverage Analysis"
            if [ -f "reports/deploy-report.json" ]; then
              DEPLOY_STATUS=$(jq -r '.result.status // "Unknown"' reports/deploy-report.json 2>/dev/null || echo "Unknown")
              
              if [ "$DEPLOY_STATUS" = "Succeeded" ]; then
                echo "✅ **Validation Passed:** All tests and coverage requirements met"
              elif [ "$DEPLOY_STATUS" = "Skipped" ]; then
                echo "⚪ **No Testing Required:** No Apex changes detected"
              else
                echo "❌ **Validation Failed:** Check test execution and coverage"
                echo ""
                echo "🔍 **Detailed Error Analysis (concise & actionable):**"
                echo "==============================================="

                if [ -f "reports/deploy-report.json" ] && [ -s "reports/deploy-report.json" ]; then

                  # Print direct error message if present
                  if jq -e '.message' reports/deploy-report.json > /dev/null 2>&1; then
                    echo "💬 **Error Message:**"
                    jq -r '.message' reports/deploy-report.json 2>/dev/null
                    echo ""
                  fi

                  # Component failures (explicit)
                  if jq -e '.result.details.componentFailures' reports/deploy-report.json > /dev/null 2>&1; then
                    CF_COUNT=$(jq '.result.details.componentFailures | length' reports/deploy-report.json 2>/dev/null || echo "0")
                    if [ "$CF_COUNT" -gt 0 ]; then
                      echo "🔧 **Component Failures (${CF_COUNT}):**"
                      jq -r '.result.details.componentFailures[]? | "   • \(.fileName // .name): \(.problem) (\(.problemType // "Unknown"))"' reports/deploy-report.json 2>/dev/null
                      echo ""
                    fi
                  fi

                  # Test failures (explicit, exact lines)
                  if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json > /dev/null 2>&1; then
                    TF_COUNT=$(jq '.result.details.runTestResult.failures | length' reports/deploy-report.json 2>/dev/null || echo "0")
                    if [ "$TF_COUNT" -gt 0 ]; then
                      echo "🧪 **Test Failures (${TF_COUNT}):**"
                      jq -r '.result.details.runTestResult.failures[]? | "   • \(.name): \(.message) - Method: \(.methodName // "unknown")"' reports/deploy-report.json 2>/dev/null
                      echo ""
                    fi
                  fi

                  # Per-class numeric coverage
                  if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json > /dev/null 2>&1; then
                    echo "📊 **Coverage Achieved (average):**"
                    AVG=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' reports/deploy-report.json 2>/dev/null || echo "0")
                    AVG=${AVG%.*}
                    echo "   • ${AVG}%"
                    if jq -e '.result.details.runTestResult.codeCoverage[]? | select(.coveredPercent != null)' reports/deploy-report.json > /dev/null 2>&1; then
                      echo "   **Per-Class (numeric only):**"
                      jq -r '.result.details.runTestResult.codeCoverage[]? | select(.coveredPercent != null) | "     • \(.name): \(.coveredPercent)%"' reports/deploy-report.json 2>/dev/null | head -10
                      echo ""
                    fi
                  fi

                  # Show only problematic componentSuccesses (if any)
                  if jq -e '.result.details.componentSuccesses' reports/deploy-report.json > /dev/null 2>&1; then
                    PROB=$(jq -r '.result.details.componentSuccesses[]? |
                      select((.problem != null and (.problem|tostring) != "") and (.problemType // "") != "Info") |
                      "   • \(.fileName // .fullName // "unknown"): \(.problem) (\(.problemType // "Unknown"))"' reports/deploy-report.json 2>/dev/null || echo "")
                    if [ -n "$PROB" ]; then
                      echo "⚠️ **Component notes / warnings:**"
                      echo "$PROB"
                      echo ""
                    fi
                  fi

                else
                  echo "📭 **No deploy report found to analyze errors**"
                  echo ""
                fi

                echo "==============================================="
              fi
            fi
            echo ""
            
            echo "🔍 Static Code Analysis"
            APEX_VIOLATIONS=$(jq '.violations | length' reports/apex.json 2>/dev/null || echo "0")
            LWC_VIOLATIONS=$(jq '.violations | length' reports/lwc.json 2>/dev/null || echo "0")
            TOTAL_VIOLATIONS=$((APEX_VIOLATIONS + LWC_VIOLATIONS))
            
            if [ $TOTAL_VIOLATIONS -eq 0 ]; then
              echo "✅ Code Quality: Excellent (0 violations)"
            elif [ $TOTAL_VIOLATIONS -le 5 ]; then
              echo "🟡 Code Quality: Good ($TOTAL_VIOLATIONS violations)"
            else
              echo "🔴 Code Quality: Needs Attention ($TOTAL_VIOLATIONS violations)"
            fi
            
          else
            echo "📌 Validation Status: Skipped"
            echo "ℹ️  Reason: No deployable metadata found in delta"
            echo ""
            echo "🔍 Static Code Analysis: ✅ No violations"
            echo "📊 Code Quality: 🟢 Excellent (0 violations)"
          fi

      - name: Enforce Validation Result
        if: always()
        run: |
          set -uo pipefail

          echo "Enforcing validation result..."

          if [ ! -f reports/deploy-report.json ]; then
            echo "❌ No deploy report found (reports/deploy-report.json). Failing the job."
            exit 1
          fi

          # Read status, component failures, test failures, coverage
          STATUS=$(jq -r '.result.status // "Failed"' reports/deploy-report.json 2>/dev/null || echo "Failed")
          COMPONENT_FAIL_COUNT=0
          if jq -e '.result.details.componentFailures' reports/deploy-report.json >/dev/null 2>&1; then
            COMPONENT_FAIL_COUNT=$(jq '.result.details.componentFailures | length' reports/deploy-report.json 2>/dev/null || echo "0")
          fi
          TEST_FAIL_COUNT=0
          if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json >/dev/null 2>&1; then
            TEST_FAIL_COUNT=$(jq '.result.details.runTestResult.failures | length' reports/deploy-report.json 2>/dev/null || echo "0")
          fi
          COVERAGE=0
          if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
            COVERAGE=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' reports/deploy-report.json 2>/dev/null || echo "0")
            COVERAGE=${COVERAGE%.*}
          fi

          echo "  • Status: ${STATUS}"
          echo "  • Component failures: ${COMPONENT_FAIL_COUNT}"
          echo "  • Test failures: ${TEST_FAIL_COUNT}"
          echo "  • Coverage: ${COVERAGE}% (threshold: ${COVERAGE_THRESHOLD}%)"

          # Allowed statuses: Succeeded, Skipped
          if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Skipped" ]; then
            # but still enforce coverage threshold when there were Apex tests run (Skipped implies no apex changes -> allow)
            if [ "$STATUS" = "Succeeded" ] && jq -e '.result.details.runTestResult' reports/deploy-report.json >/dev/null 2>&1; then
              if [ "${COVERAGE}" -lt "${COVERAGE_THRESHOLD}" ]; then
                echo "❌ Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%. Failing the job."
                exit 1
              fi
            fi

            if [ "${COMPONENT_FAIL_COUNT}" -gt 0 ] || [ "${TEST_FAIL_COUNT}" -gt 0 ]; then
              echo "❌ Component or test failures present despite overall Succeeded/Skipped status. Failing the job."
              exit 1
            fi

            echo "✅ Validation passed enforcement checks."
            exit 0
          else
            echo "❌ Validation status is '${STATUS}' — failing the job."
            exit 1
          fi
