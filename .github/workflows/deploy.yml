name: Salesforce CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  SEVERITY_THRESHOLD: 3
  COVERAGE_THRESHOLD: 75

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout Repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node & Salesforce CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Salesforce CLI
        uses: actions/cache@v4
        with:
          path: ~/.sf
          key: sf-cli-${{ runner.os }}-${{ hashFiles('**/sfdx-project.json') }}
          restore-keys: |
            sf-cli-${{ runner.os }}-

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli --silent
          sf --version

      - name: Authenticate Salesforce (PR Validation)
        env:
          SF_AUTH_URL: ${{ secrets.SF_SANDBOX_AUTH_URL }}
        run: |
          echo "$SF_AUTH_URL" > /tmp/authFile.txt
          sf org login sfdx-url --sfdx-url-file /tmp/authFile.txt --alias sandbox --set-default
          rm -f /tmp/authFile.txt

      - name: Create Delta Output Directory
        run: mkdir -p delta reports

      - name: Install sfdx-git-delta Plugin
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins --core

      - name: Generate Delta using sfdx-git-delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin ${{ github.base_ref }} --quiet
          echo "Generating delta from origin/${{ github.base_ref }} to HEAD"
          sf sgd source delta --to HEAD --from origin/${{ github.base_ref }} --output delta --generate-delta
          ls -la delta || true

      - name: Show Generated Package.xml Files
        run: |
          echo "=== Delta Directory Structure ==="
          find delta -type f | head -20 || echo "No delta files found"
          echo ""
          echo "=== package.xml (delta) if exists ==="
          [ -f delta/package/package.xml ] && sed -n '1,200p' delta/package/package.xml || echo "No package.xml in delta"
          echo ""

      - name: Run Salesforce Code Analyzer for Apex
        id: run-code-analyzer-apex
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >
            --target force-app/main/default/classes
            --view detail
            --output-file reports/apex.json
            --severity-threshold ${{ env.SEVERITY_THRESHOLD }}
        continue-on-error: true

      - name: Run Salesforce Code Analyzer for LWC
        id: run-code-analyzer-lwc
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: >
            --target force-app/main/default/lwc
            --view detail
            --output-file reports/lwc.json
            --severity-threshold ${{ env.SEVERITY_THRESHOLD }}
        continue-on-error: true

      - name: Upload Code Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analysis-reports
          path: reports/
          retention-days: 30

      - name: Analyze Delta and Map Test Classes
        id: analyze_delta
        run: |
          echo "🔍 Test mapping and delta membership extraction"
          mkdir -p reports

          # Extract apex class members from delta package.xml (if exists)
          DELTA_MEMBERS=""
          if [ -f delta/package/package.xml ]; then
            DELTA_MEMBERS=$(grep '<members>' delta/package/package.xml | sed -E 's/.*<members>([^<]+)<\/members>.*/\1/' | tr '\n' ' ' | xargs -n1 | sort -u | xargs || true)
          fi

          echo "Delta members (from delta/package/package.xml): ${DELTA_MEMBERS:-<none>}"
          echo "DELTA_MEMBERS=${DELTA_MEMBERS}" >> $GITHUB_ENV

          # Existing mapping logic (unchanged)
          APEX_CLASSES=$(find delta/force-app/main/default/classes -name '*.cls' -maxdepth 1 -exec basename {} .cls \; | tr '\n' ' ' | sed 's/ *$//')
          echo "APEX_CLASSES=$APEX_CLASSES" >> $GITHUB_ENV

          TESTS_IN_DELTA=""
          PROD_CLASSES=""

          if [ -n "$APEX_CLASSES" ]; then
            for cls in $APEX_CLASSES; do
              file_path=$(find delta/force-app force-app -path "*/classes/${cls}.cls" 2>/dev/null | head -n1)
              if [ -z "$file_path" ]; then
                PROD_CLASSES="$PROD_CLASSES $cls"
                continue
              fi
              if grep -qi "@isTest" "$file_path"; then
                TESTS_IN_DELTA="$TESTS_IN_DELTA $cls"
              else
                PROD_CLASSES="$PROD_CLASSES $cls"
              fi
            done
            TESTS_IN_DELTA=$(echo "$TESTS_IN_DELTA" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
            PROD_CLASSES=$(echo "$PROD_CLASSES" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
          fi

          # Build simple mapping JSON
          RELATED_TESTS=""
          echo "{" > reports/test-mapping.json
          echo '  "mapping": [' >> reports/test-mapping.json
          SEP=""
          if [ -n "$PROD_CLASSES" ] && [ -n "$TESTS_IN_DELTA" ]; then
            for pc in $PROD_CLASSES; do
              FOUND=""
              for tc in $TESTS_IN_DELTA; do
                tf=$(find delta/force-app force-app -path "*/classes/${tc}.cls" 2>/dev/null | head -n1)
                if [ -n "$tf" ] && grep -qiE "(new[[:space:]]+${pc}\b|${pc}\.[A-Za-z_]|${pc}[[:space:]]*\()" "$tf"; then
                  FOUND="$FOUND $tc"
                fi
              done
              FOUND=$(echo "$FOUND" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
              [ -n "$FOUND" ] && RELATED_TESTS="$RELATED_TESTS $FOUND"
              if [ -n "$FOUND" ]; then
                JSON_TESTS=$(echo "$FOUND" | xargs -n1 | sed 's/^/"/;s/$/"/' | paste -sd, -)
              else
                JSON_TESTS=""
              fi
              echo "$SEP    {\"apexClass\": \"${pc}\", \"tests\": [${JSON_TESTS}]}" >> reports/test-mapping.json
              SEP=","
            done
          fi
          echo '  ]' >> reports/test-mapping.json
          echo '}' >> reports/test-mapping.json

          RELATED_TESTS=$(echo "$RELATED_TESTS" | xargs -n1 2>/dev/null | sort -u | xargs || echo "")
          echo "RELATED_TESTS=${RELATED_TESTS}" >> $GITHUB_ENV
          echo "✅ Test mapping complete. Tests to run: ${RELATED_TESTS:-none (RunLocalTests fallback)}"

      - name: Validate with Intelligent Test Selection
        id: validate_deploy
        run: |
          set -euo pipefail
          mkdir -p reports
          # default report
          echo '{"result":{"status":"Failed","message":"No deploy run performed"}}' > reports/deploy-report.json
          echo "" > reports/validation-summary.txt

          summary() { echo "$1" | tee -a reports/validation-summary.txt; }

          if [ -d "delta/force-app" ] && [ "$(find delta/force-app -type f | wc -l)" -gt 0 ]; then
            summary "Delta found: deployable metadata present."

            if find delta/force-app -name "*.cls" -o -name "*.trigger" | grep -q .; then
              summary "Apex changes detected: will run tests."

              if [ -n "${RELATED_TESTS:-}" ]; then
                RELATED_TESTS_CSV=$(echo "$RELATED_TESTS" | xargs -n1 | paste -sd, - || echo "")
                summary "Using mapped tests: ${RELATED_TESTS_CSV}"

                summary "Running deploy validation with mapped tests..."
                if sf project deploy start \
                  --source-dir delta/force-app \
                  --target-org sandbox \
                  --dry-run \
                  --test-level RunSpecifiedTests \
                  --tests "$RELATED_TESTS_CSV" \
                  --json > reports/deploy-report.json 2>&1; then
                  summary "Mapped-tests deploy validation: Succeeded"
                else
                  summary "Mapped-tests deploy validation: Failed (see reports/deploy-report.json). Will retry with RunLocalTests."
                fi

                # compute overall coverage if available
                COVERAGE=0
                if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
                  COVERAGE=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' reports/deploy-report.json 2>/dev/null || echo "0")
                  COVERAGE=${COVERAGE%.*}
                fi
                summary "Coverage from mapped-tests run: ${COVERAGE}%"

                if [ "$COVERAGE" -lt "${COVERAGE_THRESHOLD}" ] || jq -e '.result.status != "Succeeded"' reports/deploy-report.json >/dev/null 2>&1; then
                  summary "Triggering fallback: RunLocalTests (either mapped run failed or coverage < ${COVERAGE_THRESHOLD}%)."
                  if sf project deploy start \
                    --source-dir delta/force-app \
                    --target-org sandbox \
                    --dry-run \
                    --test-level RunLocalTests \
                    --json > reports/deploy-report-coverage.json 2>&1; then
                    summary "Fallback RunLocalTests: Succeeded"
                    mv reports/deploy-report-coverage.json reports/deploy-report.json
                  else
                    summary "Fallback RunLocalTests: Failed (see reports/deploy-report-coverage.json)"
                    mv reports/deploy-report-coverage.json reports/deploy-report.json || true
                  fi
                else
                  summary "Mapped-tests coverage meets threshold; no fallback required."
                fi

              else
                summary "No mapped tests found; running RunLocalTests."
                if sf project deploy start \
                  --source-dir delta/force-app \
                  --target-org sandbox \
                  --dry-run \
                  --test-level RunLocalTests \
                  --json > reports/deploy-report.json 2>&1; then
                  summary "RunLocalTests deploy validation: Succeeded"
                else
                  summary "RunLocalTests deploy validation: Failed (see reports/deploy-report.json)"
                fi
              fi

            else
              summary "No Apex files found, skipping test execution"
              sf project deploy start \
                --source-dir delta/force-app \
                --target-org sandbox \
                --dry-run \
                --test-level NoTestRun \
                --json > reports/deploy-report.json 2>&1 || true
            fi
          else
            summary "No deployable metadata found in delta. Skipping validation."
            echo '{"result":{"status":"Skipped","message":"No changes to deploy"}}' > reports/deploy-report.json
          fi

          # After deploy run: parse delta members into local file for downstream reporting
          if [ -f delta/package/package.xml ]; then
            grep '<members>' delta/package/package.xml | sed -E 's/.*<members>([^<]+)<\/members>.*/\1/' | tr '\n' ' ' | xargs -n1 | sort -u > /tmp/delta_members.txt || true
            echo "Delta members saved to /tmp/delta_members.txt"
            echo "----"
            cat /tmp/delta_members.txt || true
          else
            echo "No delta/package/package.xml found; reporting will use full coverage info."
          fi

      - name: Display Validation Summary (delta-focused)
        if: always()
        run: |
          set -euo pipefail
          # defaults
          STATUS="Failed"
          COMPONENT_FAIL_COUNT=0
          TEST_FAIL_COUNT=0
          COVERAGE=0

          if [ -f reports/deploy-report.json ]; then
            STATUS=$(jq -r '.result.status // "Failed"' reports/deploy-report.json 2>/dev/null || echo "Failed")
          fi

          if jq -e '.result.details.componentFailures' reports/deploy-report.json >/dev/null 2>&1; then
            COMPONENT_FAIL_COUNT=$(jq '.result.details.componentFailures | length' reports/deploy-report.json 2>/dev/null || echo "0")
          fi

          if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json >/dev/null 2>&1; then
            TEST_FAIL_COUNT=$(jq '.result.details.runTestResult.failures | length' reports/deploy-report.json 2>/dev/null || echo "0")
          fi

          # compute delta-aware coverage if possible
          DELTA_FILE="/tmp/delta_members.txt"
          DELTA_PRESENT="false"
          if [ -f "$DELTA_FILE" ] && [ -s "$DELTA_FILE" ]; then
            DELTA_PRESENT="true"
            # Build coverage TSV of all reported classes
            if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
              jq -r '.result.details.runTestResult.codeCoverage[]? | "\(.name)\t\(.coveredPercent // "N/A")"' reports/deploy-report.json 2>/dev/null > /tmp/coverage.tsv || true
            else
              > /tmp/coverage.tsv
            fi

            # iterate delta members: collect numeric, zero, null lists
            NUMERIC_TOTAL=0
            NUMERIC_COUNT=0
            NUMERIC_LINES_FILE=/tmp/delta_numeric.txt
            ZERO_LIST_FILE=/tmp/delta_zero.txt
            NA_LIST_FILE=/tmp/delta_na.txt
            : > "$NUMERIC_LINES_FILE"
            : > "$ZERO_LIST_FILE"
            : > "$NA_LIST_FILE"

            while IFS= read -r m; do
              # The package.xml member might be a class name, test class, or other component - we only care about Apex classes in coverage
              # Normalize: look for exact match in coverage.tsv name field
              line=$(grep -P "^${m}\t" /tmp/coverage.tsv || true)
              if [ -z "$line" ]; then
                # not present in coverage report -> N/A
                echo "$m" >> "$NA_LIST_FILE"
              else
                pct=$(echo "$line" | awk -F'\t' '{print $2}')
                if [ "$pct" = "N/A" ] || [ -z "$pct" ]; then
                  echo "$m" >> "$NA_LIST_FILE"
                else
                  # try numeric
                  num=$(echo "$pct" | sed 's/[^0-9.]//g')
                  if [ -z "$num" ]; then
                    echo "$m" >> "$NA_LIST_FILE"
                  else
                    # round to integer
                    num_int=$(printf "%.0f" "$num" 2>/dev/null || printf "%d" "$num")
                    echo "$m:$num_int" >> "$NUMERIC_LINES_FILE"
                    NUMERIC_TOTAL=$((NUMERIC_TOTAL + num_int))
                    NUMERIC_COUNT=$((NUMERIC_COUNT + 1))
                    if [ "$num_int" -eq 0 ]; then
                      echo "$m" >> "$ZERO_LIST_FILE"
                    fi
                  fi
                fi
              fi
            done < "$DELTA_FILE"

            # compute delta average coverage
            if [ "$NUMERIC_COUNT" -gt 0 ]; then
              DELTA_AVG=$((NUMERIC_TOTAL / NUMERIC_COUNT))
            else
              DELTA_AVG=0
            fi
            COVERAGE="$DELTA_AVG"
          else
            # no delta file => fallback to global average (existing behaviour)
            if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
              COVERAGE=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' reports/deploy-report.json 2>/dev/null || echo "0")
              COVERAGE=${COVERAGE%.*}
            else
              COVERAGE=0
            fi
          fi

          # write compact file summary
          echo "" >> reports/validation-summary.txt
          echo "=== DEPLOY VALIDATION SUMMARY ===" >> reports/validation-summary.txt
          echo "Status: ${STATUS}" >> reports/validation-summary.txt
          echo "Component failures: ${COMPONENT_FAIL_COUNT}" >> reports/validation-summary.txt
          echo "Test failures: ${TEST_FAIL_COUNT}" >> reports/validation-summary.txt
          echo "Average coverage (delta-aware): ${COVERAGE}%" >> reports/validation-summary.txt
          echo "================================" >> reports/validation-summary.txt

          # job log short summary
          echo ""
          echo "🔎 Validation summary (short):"
          echo "  • Status: ${STATUS}"
          echo "  • Component failures: ${COMPONENT_FAIL_COUNT}"
          echo "  • Test failures: ${TEST_FAIL_COUNT}"
          echo "  • Coverage (delta-aware): ${COVERAGE}% (threshold: ${COVERAGE_THRESHOLD}%)"

          if [ "${COMPONENT_FAIL_COUNT}" -gt 0 ] || [ "${TEST_FAIL_COUNT}" -gt 0 ] || [ "${COVERAGE}" -lt "${COVERAGE_THRESHOLD}" ]; then
            echo "⚠️  Validation issues detected. See reports/deploy-report.json and reports/validation-summary.txt for details."

            # Print concise test failure examples (sanitized). Limit to 10.
            if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json >/dev/null 2>&1; then
              echo ""
              echo "🧪 Top test failures (sanitized):"
              jq -r '.result.details.runTestResult.failures[]? |
                "\(.name) - Method: \(.methodName // "unknown")\n\(.message // "" )" ' reports/deploy-report.json 2>/dev/null \
                | sed -e "s/<br>/\\n/g" -e "s/<[^>]*>//g" \
                | awk -v RS= -v ORS="\n\n" 'NR<=10{print}' || true
            fi

            # Component failures but only those relevant to delta members (if delta exists)
            if [ -f /tmp/delta_members.txt ]; then
              echo ""
              echo "🔧 Component failures relevant to delta (if any):"
              jq -c '.result.details.componentFailures[]?' reports/deploy-report.json 2>/dev/null | while read -r cf; do
                fname=$(echo "$cf" | jq -r '.fileName // .name // empty')
                # derive base name (e.g., classes/MyClass.cls -> MyClass)
                base=$(basename "$fname" | sed 's/\.cls$//;s/\.trigger$//;s/\.flow.*$//')
                if grep -Fxq "$base" /tmp/delta_members.txt 2>/dev/null; then
                  echo "  • $fname: $(echo "$cf" | jq -r '.problem // "Unknown")"
                fi
              done

              # If none printed, say none
              if ! (jq -r '.result.details.componentFailures[]? | .fileName // .name' reports/deploy-report.json 2>/dev/null | sed -n '1,1p' | xargs -I{} bash -c 'base=$(basename "{}" | sed "s/\.cls$//;s/\.trigger$//"); grep -Fxq "$base" /tmp/delta_members.txt 2>/dev/null && echo "found" || true') >/dev/null 2>&1; then
                # The check above is noisy; simplify: print nothing here if no delta-matching component failures
                :
              fi
            else
              # No delta file - print component failures globally (concise)
              if [ "${COMPONENT_FAIL_COUNT}" -gt 0 ]; then
                echo ""
                echo "🔧 Component failures:"
                jq -r '.result.details.componentFailures[]? | "  • " + (.fileName // .name) + ": " + (.problem // "Unknown problem")' reports/deploy-report.json 2>/dev/null | head -10 || true
              fi
            fi

            # Coverage breakdown (delta-focused)
            if [ "$DELTA_PRESENT" = "true" ]; then
              echo ""
              echo "📊 **Coverage Achieved for delta (average):**"
              echo "   • ${COVERAGE}%"
              echo ""
              echo "📋 **Coverage breakdown (delta classes only):**"

              if [ -f /tmp/delta_numeric.txt ] && [ -s /tmp/delta_numeric.txt ]; then
                echo ""
                echo "  • Classes with numeric coverage:"
                sed -n '1,50p' /tmp/delta_numeric.txt | sed 's/:/: /' | sed 's/^/    - /'
              fi

              if [ -s /tmp/delta_zero.txt ]; then
                echo ""
                echo "  • Classes reporting 0% coverage (need tests):"
                sed -n '1,200p' /tmp/delta_zero.txt | sed 's/^/    - /'
              fi

              if [ -s /tmp/delta_na.txt ]; then
                echo ""
                echo "  • Classes reporting N/A for coverage (coverage not available):"
                sed -n '1,200p' /tmp/delta_na.txt | sed 's/^/    - /'
              fi

              echo ""
              echo "  • Classes below overall threshold (${COVERAGE_THRESHOLD}%):"
              # show delta numeric lines below threshold
              if [ -f /tmp/delta_numeric.txt ]; then
                awk -F: -v thr="${COVERAGE_THRESHOLD}" '{ if ($2+0 < thr) printf "    - %s: %s%%\n", $1, $2 }' /tmp/delta_numeric.txt | sed -n '1,200p' || true
              fi

            else
              # fallback global coverage info (previous behaviour)
              if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
                echo ""
                echo "📊 **Coverage Achieved (average, global):**"
                AVG=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' reports/deploy-report.json 2>/dev/null || echo "0")
                AVG=${AVG%.*}
                echo "   • ${AVG}%"
              fi
            fi

          else
            echo "✅ Validation passed or skipped (no issues)."
          fi

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: reports/
          retention-days: 30

      - name: Fail job on validation problems (delta-aware)
        if: always()
        run: |
          set -euo pipefail
          # Determine status and counts
          if [ -f reports/deploy-report.json ]; then
            STATUS=$(jq -r '.result.status // "Failed"' reports/deploy-report.json 2>/dev/null || echo "Failed")
          else
            STATUS="Failed"
          fi

          COMPONENT_FAIL_COUNT=0
          if jq -e '.result.details.componentFailures' reports/deploy-report.json >/dev/null 2>&1; then
            COMPONENT_FAIL_COUNT=$(jq '.result.details.componentFailures | length' reports/deploy-report.json 2>/dev/null || echo "0")
          fi

          TEST_FAIL_COUNT=0
          if jq -e '.result.details.runTestResult.failures' reports/deploy-report.json >/dev/null 2>&1; then
            TEST_FAIL_COUNT=$(jq '.result.details.runTestResult.failures | length' reports/deploy-report.json 2>/dev/null || echo "0")
          fi

          # choose coverage metric: delta-aware if delta file exists, else global
          COVERAGE=0
          if [ -f /tmp/delta_members.txt ] && [ -s /tmp/delta_members.txt ]; then
            if [ -f /tmp/delta_numeric.txt ] && [ -s /tmp/delta_numeric.txt ]; then
              # compute average of numeric delta coverage values
              SUM=0; COUNT=0
              while IFS=: read -r name pct; do
                SUM=$((SUM + pct))
                COUNT=$((COUNT + 1))
              done < /tmp/delta_numeric.txt
              if [ "$COUNT" -gt 0 ]; then
                COVERAGE=$((SUM / COUNT))
              else
                COVERAGE=0
              fi
            else
              COVERAGE=0
            fi
          else
            # fallback global average
            if jq -e '.result.details.runTestResult.codeCoverage' reports/deploy-report.json >/dev/null 2>&1; then
              COVERAGE=$(jq -r '[.result.details.runTestResult.codeCoverage[]? | (.coveredPercent // 0)] | (if length>0 then (add/length) else 0 end)' reports/deploy-report.json 2>/dev/null || echo "0")
              COVERAGE=${COVERAGE%.*}
            else
              COVERAGE=0
            fi
          fi

          echo "Validation check: status=${STATUS}, component_failures=${COMPONENT_FAIL_COUNT}, test_failures=${TEST_FAIL_COUNT}, coverage=${COVERAGE}% (threshold=${COVERAGE_THRESHOLD}%)"

          if [ "$STATUS" != "Succeeded" ] || [ "${COMPONENT_FAIL_COUNT}" -gt 0 ] || [ "${TEST_FAIL_COUNT}" -gt 0 ] || [ "${COVERAGE}" -lt "${COVERAGE_THRESHOLD}" ]; then
            echo "🚫 Failing job due to validation issues. See validation-reports artifact for details."
            exit 1
          else
            echo "✅ Validation OK"
            exit 0
          fi
